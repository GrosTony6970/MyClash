name: E2E (prod)

# Opt-in only. This drives a DEPLOYED environment and writes real data
# (scoped to a throwaway event that is hard-deleted in teardown), so it never
# runs on push/PR. Trigger it manually, or let the nightly schedule run it.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly

concurrency:
  group: e2e-prod
  cancel-in-progress: false

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11.20.0'

jobs:
  # Edge review of the PUBLIC app host only.
  #
  # `--hosts=app` is not a shortcut, it is the whole reason this can run in CI:
  # admin.${DOMAIN} sits behind myclash-geoblock-admin, an allow-list over
  # [FR,BE,LU,CH,DE,IT,ES,GB,NL,AT] that fails CLOSED, and geoblock runs before
  # the security-headers middleware — a GitHub runner would be denied before it
  # could ever see an HSTS header. app.${DOMAIN} uses the public block-list
  # ([CN,RU,KP,IR,BY], fails OPEN) and answers anyone.
  #
  # Separate job, not a step inside e2e-prod: a Playwright failure must not mask
  # it, and it has to still run on the nights the suite is skipped. This is what
  # notices, without a deploy, that the app certificate is expiring or that
  # realtime has stopped resolving its tenant (websockets silently dead).
  edge-review:
    name: Edge / TLS review (public host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Review app host edge
        if: '!cancelled()'
        run: |
          ARGS=(--domain "$EDGE_DOMAIN" --hosts=app)
          if [ "${ALLOW_STAGING:-}" = "1" ]; then ARGS+=(--allow-staging-cert=1); fi
          node scripts/check-edge-tls.mjs "${ARGS[@]}"
        env:
          EDGE_DOMAIN: ${{ vars.EDGE_DOMAIN || 'myclash.fr' }}
          # Public by construction — it ships in every browser bundle. Without
          # it the realtime probe is skipped and the job proves much less.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Set repo variable EDGE_ALLOW_STAGING_CERT=1 while prod runs on
          # `deploy.sh --dev-certs`; the staging cert is reported either way.
          ALLOW_STAGING: ${{ vars.EDGE_ALLOW_STAGING_CERT }}

  e2e-prod:
    name: Playwright against deployed env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run prod E2E suite
        run: pnpm test:e2e:prod
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://admin.myclash.fr' }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ORG_SLUG: ${{ secrets.E2E_ORG_SLUG }}
          E2E_RUN_ID: ${{ github.run_id }}
          E2E_CLEANUP: '1' # CI deletes its test data; local runs preserve it for inspection
          # Opt-in specs the nightly DOES run. They are gated so a casual local
          # run stays quick, but a nightly that skips its own coverage is
          # theatre: between them these found five production bugs, and they
          # cost about three minutes.
          E2E_DOUBLE_ELIM: '1' # 09 — ~1.4 min
          E2E_SCORING_PAD: '1' # 10 — ~20 s
          E2E_LEAGUE: '1' # 11 — ~30 s
          E2E_EXPORTS: '1' # 12 — ~20 s
          E2E_PRIVACY: '1' # 13 — ~15 s
          E2E_COMPENSATION: '1' # 14 — ~25 s
          E2E_PUBLIC_SITE: '1' # 15 — ~25 s
          E2E_PAD_UI: '1' # 16 — ~40 s
          E2E_ARCHIVE: '1' # 17 — ~1 min
          E2E_STAFF: '1' # 18 — ~2-3 min (waits on the 60s auto-lock scan)
          E2E_WORKSHOPS: '1' # 19 — ~30 s
          E2E_SCHEDULE: '1' # 20 + 21 — ~1 min
          E2E_SWISS: '1' # 22 + 23 + 24 + 25 — ~6 min (played off the pad, plus a browser pass)
          E2E_SUPER_ADMIN: '1' # 27 — ~5 s (the console half needs the secrets below)
          E2E_LIVE_BOARD: '1' # 28 — ~15 s
          E2E_AI: '1' # 30 — ~30 s (31 needs the provider secrets below)
          # 27's console half runs only where a dedicated platform account exists.
          # Absent these, it SKIPS rather than fails — the org owner must never be
          # promoted to super admin, or 13's retention interlock silently disarms.
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          # 31-ai-generation is the ONLY spec in this suite that spends money: it
          # calls a real LLM provider on every run. It is therefore opt-in by
          # SECRET rather than by flag — set these two and the nightly starts
          # billing tokens; leave them unset and 31 skips while 30 still covers
          # the whole configuration surface for free.
          E2E_AI_PROVIDER: ${{ secrets.E2E_AI_PROVIDER }}
          E2E_AI_KEY: ${{ secrets.E2E_AI_KEY }}
          # E2E_POPULATE stays OFF on purpose: 07 is a ~30 min demo-data
          # populator, not a regression test (its step() swallows every error),
          # so running it nightly would cost half an hour and assert nothing.

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: playwright-report
          retention-days: 7
