name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11.20.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Install & cache ──────────────────────────────────────────────────────
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ── Build shared packages ────────────────────────────────────────────────
  build-packages:
    name: Build shared packages
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build packages
        run: pnpm turbo run build --filter="@myclash/types" --filter="@myclash/rulesets" --filter="@myclash/db" --filter="@myclash/ui" --filter="@myclash/i18n" --filter="@myclash/api-client"

      - name: Save Turborepo cache
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}

      - name: Upload package dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: packages/*/dist
          retention-days: 1

  # ── Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages

      - name: Typecheck all workspaces
        run: pnpm turbo run typecheck

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages

      - name: Lint all workspaces
        run: pnpm turbo run lint

      # Everything below is an independent VERDICT: each reads the repo and
      # reports pass/fail, and none depends on a previous step's side effects.
      # So each gets its own step and `if: '!cancelled()'`, for two reasons.
      #
      # They used to be a `&&` chain plus default step ordering, which meant the
      # FIRST failure hid every gate behind it. quality:complexity has been red
      # on main since at least 2026-06-16 (500+ commits), so shared-types,
      # design:lint, db:review, db:perf:fixture, infra:review,
      # observability:review, perf:review and format:check had not actually run
      # in CI for six weeks — they were skipped, not passing.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop.

      # Phantom dependencies twice in one sweep: web-public ran vitest without
      # declaring it, and @vitest/coverage-v8 was undeclared in all three
      # workspaces that invoke it. Both would have been named install-time
      # failures here. --lockfile-only so it does not depend on this job's
      # cache restore, which has no fail-on-cache-miss.
      - name: Check peer dependencies
        if: '!cancelled()'
        run: pnpm quality:peers

      - name: Check frontend secret boundaries
        if: '!cancelled()'
        run: pnpm security:client-secrets

      # Step name deliberately avoids spelling the marker out — check-todos
      # scans yml too, and would flag its own CI step.
      - name: Check untracked debt markers
        if: '!cancelled()'
        run: pnpm quality:todos

      - name: Check API docs coverage
        if: '!cancelled()'
        run: pnpm quality:api-docs

      - name: Check code complexity budget
        if: '!cancelled()'
        run: pnpm quality:complexity

      # Reads each workspace's tsconfig.build.json through the TypeScript API,
      # so it checks the real emit PROGRAM rather than a filename glob —
      # `exclude` prunes only the root set, and an imported helper re-enters
      # looking perfectly excluded.
      - name: Check test code is out of the emit surface
        if: '!cancelled()'
        run: pnpm quality:test-code-leak

      # Every NEXT_PUBLIC_* a web app requires at build time must be declared as
      # a Dockerfile ARG and passed by both compose files. Reviewing this
      # cheaply is the point: the check that already existed lives in
      # next.config and only fires when someone builds the image, which is how
      # the dev stack and three Trivy legs stayed broken.
      - name: Check client env contract
        if: '!cancelled()'
        run: pnpm quality:client-env

      # Needs the COMPILED api: the OpenAPI document is built by booting
      # dist/app.module, not by reading source. No other job produces it, so
      # this step builds it itself.
      #
      # Worth the ~40s: the generated client silently drifted 36 routes behind
      # the API (and kept 5 deleted ones) because nothing ever regenerated it —
      # the emit had been OOMing since 2026-05-19 and no gate noticed.
      - name: Build API for OpenAPI emit
        if: '!cancelled()'
        run: pnpm --filter @myclash/api build

      - name: Check OpenAPI client drift
        if: '!cancelled()'
        run: pnpm quality:openapi-drift

      - name: Check shared-type leaks
        if: '!cancelled()'
        run: pnpm quality:shared-types

      - name: Check design system drift
        if: '!cancelled()'
        run: pnpm design:lint

      - name: Check database review gates
        if: '!cancelled()'
        run: pnpm db:review

      # A postgres_changes binding on an unpublished table does not degrade
      # itself — supabase-js kills the WHOLE channel with a permanent
      # CHANNEL_ERROR. See 0167_realtime_match_penalties.sql for the outage.
      - name: Check realtime bindings are published
        if: '!cancelled()'
        run: pnpm db:realtime-bindings

      - name: Check database perf fixture
        if: '!cancelled()'
        run: pnpm db:perf:fixture

      - name: Check infrastructure review gates
        if: '!cancelled()'
        run: pnpm infra:review

      - name: Check observability review gates
        if: '!cancelled()'
        run: pnpm observability:review

      - name: Check performance review gates
        if: '!cancelled()'
        run: pnpm perf:review

      # The bundle budget was registered in package.json and run by no workflow,
      # so its meta-gate proved only that the script existed. It needs a build to
      # weigh: web-marketing has no workspace dependencies, so it builds here on
      # its own. The Test job builds it too, as part of web-marketing's `test`
      # script, but turbo declares only coverage/** as that task's output — on a
      # cache hit dist/ is never restored and the budget would silently measure
      # nothing again.
      - name: Build the marketing site for the bundle budget
        if: '!cancelled()'
        run: pnpm --filter @myclash/web-marketing build

      # The page-load budgets weigh what a visitor downloads on any page: the
      # root shell plus the root layout's client entry. They need a real build,
      # and only web-public had one — inside its own test chain — so web-staff
      # and web-admin had never been measured at all. The driver builds every
      # app the budget registry names, with placeholder env derived from each
      # next.config.ts, so a new budget cannot sit dormant for want of a build.
      - name: Build the apps for the bundle budgets
        if: '!cancelled()'
        run: pnpm perf:bundle:build

      # --include-next or the three page-load budgets skip themselves and the
      # step passes having weighed only the marketing site. That is how this
      # gate spent its whole life: registered, invoked, and measuring nothing.
      # --require-build so an absent build fails instead of skipping.
      - name: Check bundle budgets
        if: '!cancelled()'
        run: pnpm perf:bundle -- --include-next --require-build

      # Root-level scripts/ is outside the turbo workspace graph, so
      # `turbo run test` never covered it. Three of these tests had rotted
      # against current behaviour precisely because nothing ran them.
      - name: Test repo scripts
        if: '!cancelled()'
        run: pnpm test:scripts

      # A Mermaid block with a syntax error renders as a plain grey code block
      # on GitHub instead of failing — nothing else in the pipeline parses fence
      # contents, so a broken diagram would survive review indefinitely.
      - name: Check docs diagrams parse
        if: '!cancelled()'
        run: pnpm docs:mermaid

      - name: Check formatting
        if: '!cancelled()'
        run: pnpm format:check

  # ── Test ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages

      # TZ is pinned rather than inherited: GitHub runners are UTC today, and a
      # silent change of that default would silently change what these two legs
      # mean.
      - name: Run tests
        run: pnpm turbo run test
        env:
          TZ: UTC

      # The same suite under a zone with an offset. The scheduler and the
      # programme service do WALL-CLOCK arithmetic (setHours/getHours), so a
      # whole class of defect is INVISIBLE on a UTC runner: reintroducing the
      # getUTCHours bug that moveBlock once shipped leaves the API suite fully
      # green under TZ=UTC (45 passed) and reds four specs under Europe/Paris.
      # Several specs say so in their own docblocks; until this leg existed they
      # asserted nothing in CI.
      #
      # Depends on `TZ` being declared an input of turbo's `test` task. Without
      # that this step is a CACHE HIT that replays the UTC logs and executes no
      # tests — measured, both zones hashed to the same key.
      #
      # `!cancelled()` so a UTC failure cannot mask a zone-only one; the repo
      # has been bitten by an && chain hiding later steps before.
      - name: Run tests again under a non-UTC timezone
        if: '!cancelled()'
        run: pnpm turbo run test
        env:
          TZ: Europe/Paris

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Audit high and critical vulnerabilities
        run: pnpm audit --audit-level high

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages

      - name: Run enforced coverage
        run: pnpm coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enforced-coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          retention-days: 7

  e2e:
    name: Playwright and Axe
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download package dist
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright and Axe tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  shellcheck:
    name: Shellcheck infra scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not the runner's preinstalled binary. Findings differ by version —
      # 0.9/0.10 report SC2119 and SC2015 where 0.11 does not — so an image bump
      # would change this job's verdict with no commit touching a script, which is
      # exactly how it went red unnoticed. The scripts are kept clean under 0.9
      # through 0.11; this pin decides which one is the verdict.
      #
      # `-x` follows `source`d files ONLY because .shellcheckrc sets
      # source-path=SCRIPTDIR — alone it resolves "$SCRIPT_DIR/lib/log.sh" against
      # the CWD and follows nothing.
      - name: Run shellcheck
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          SHELLCHECK="/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$SHELLCHECK" --version
          "$SHELLCHECK" -x infra/scripts/*.sh infra/scripts/lib/*.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-images:
    name: Trivy production image scan
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: myclash-api
            dockerfile: apps/api/Dockerfile
          - image: myclash-web-admin
            dockerfile: apps/web-admin/Dockerfile
          - image: myclash-web-public
            dockerfile: apps/web-public/Dockerfile
          - image: myclash-web-staff
            dockerfile: apps/web-staff/Dockerfile
          # Never scanned before. It was a one-line COPY into caddy:2-alpine and
          # nobody added it; it is now a real multi-stage build, and the runtime
          # base image has CVEs like any other.
          - image: myclash-web-marketing
            dockerfile: apps/web-marketing/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # The three web images cannot build without their NEXT_PUBLIC_* args:
      # next.config's REQUIRED_PROD_ENV check throws during `next build`, so a
      # bare `docker build` fails and those matrix legs never reached Trivy at
      # all. (The API leg declares no NEXT_PUBLIC_* and was always fine.)
      #
      # The values are placeholders — Trivy scans OS and npm packages for CVEs,
      # not bundled URLs, and the image is discarded after the scan.
      #
      # Derived from the Dockerfile's own `ARG NEXT_PUBLIC_*` lines rather than
      # listed here, so this does not become a fourth place that has to agree
      # with next.config, the Dockerfile and both compose files. Adding an ARG
      # feeds this automatically; adding a REQUIRED_PROD_ENV *without* the ARG
      # now fails here, which is the check that was missing.
      #
      # SENTRY_DSN args are skipped deliberately: none is in any
      # REQUIRED_PROD_ENV, and handing @sentry/nextjs a non-DSN string at build
      # time is a needless way to break the scan.
      - name: Build production image
        run: |
          set -euo pipefail
          # `|| true`: the API Dockerfile declares no NEXT_PUBLIC_* at all, and
          # a grep that matches nothing exits 1 — which under pipefail would
          # fail the step for the one image that needs no arguments.
          names=$(grep -oE '^ARG NEXT_PUBLIC_[A-Z_]+' "${{ matrix.dockerfile }}" \
                    | sed 's/^ARG //' | grep -v SENTRY | sort -u || true)
          args=()
          for name in $names; do
            args+=(--build-arg "$name=https://ci.invalid")
          done
          echo "derived build args: ${args[*]-none}"
          docker build -f "${{ matrix.dockerfile }}" ${args[@]+"${args[@]}"} -t ${{ matrix.image }}:ci .

      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
