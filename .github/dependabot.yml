version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      next:
        patterns: ['next', '@next/*']
      nest:
        patterns: ['@nestjs/*']
    ignore:
      # TypeScript waits for 7.1: 7.1 is offered again, 7.0.x never is.
      - dependency-name: typescript
        versions: ['7.0.x']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: '/infra'
    schedule:
      interval: monthly
