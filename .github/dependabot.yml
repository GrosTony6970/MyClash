version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      next:
        patterns: ['next', '@next/*']
      nest:
        patterns: ['@nestjs/*']
      # Sentry's packages move together (the api and the three Next apps): one PR, apart from the rest.
      sentry:
        patterns: ['@sentry/*']
      # A runtime dependency's minor or patch, outside the three framework groups above, comes in
      # one PR instead of one each. Majors still come one by one.
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: ['next', '@next/*', '@nestjs/*', '@sentry/*']
    ignore:
      # TypeScript waits for 7.1: 7.1 is offered again, 7.0.x never is.
      - dependency-name: typescript
        versions: ['7.0.x']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly

  # /infra itself holds no Dockerfile; ops-runner's is the one this job watches. The apps'
  # Dockerfiles are not watched.
  - package-ecosystem: docker
    directory: '/infra/ops-runner'
    schedule:
      interval: monthly
