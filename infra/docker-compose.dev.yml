# infra/docker-compose.dev.yml
#
# Local development stack.
# - Traefik with self-signed TLS for *.myclash.localhost
# - Postgres + Redis (data services)
# - Supabase: Auth (GoTrue), REST (PostgREST), Realtime, Storage, Kong gateway
# - All three Next.js apps + NestJS API (built from source)
#
# Prerequisites:
#   1. Add to C:\Windows\System32\drivers\etc\hosts (Windows) or /etc/hosts:
#        127.0.0.1  myclash.localhost
#        127.0.0.1  admin.myclash.localhost
#        127.0.0.1  scoring.myclash.localhost
#        127.0.0.1  api.myclash.localhost
#   2. Copy .env.example to .env and fill in values.
#   3. Docker Desktop running.
#
# Usage:
#   docker compose --env-file .env -f infra/docker-compose.dev.yml up -d --build
#   docker compose --env-file .env -f infra/docker-compose.dev.yml down
#
# Local URLs (after up):
#   https://myclash.localhost              → web-public  (port 3000 inside)
#   https://admin.myclash.localhost        → web-admin   (port 3000 inside)
#   https://scoring.myclash.localhost      → web-scoring (port 3000 inside)
#   https://api.myclash.localhost          → NestJS API  (port 4000 inside)
#   https://api.myclash.localhost/auth/v1/ → Supabase Auth (GoTrue)
#   https://api.myclash.localhost/rest/v1/ → Supabase REST (PostgREST)
#   https://api.myclash.localhost/realtime/v1/ → Supabase Realtime
#   https://api.myclash.localhost/storage/v1/  → Supabase Storage
#   http://localhost:8000                  → Kong direct (dev only)
#   http://localhost:8080                  → Traefik dashboard (dev only)
#
# Note: Browser will show a TLS warning for the self-signed cert.
# Click "Advanced → Proceed" once per hostname, or add the Traefik
# default cert to your OS trust store.

services:
  # ── Reverse proxy ────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6.6
    container_name: myclash-dev-traefik
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080' # dashboard (dev only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.dev.yml:/etc/traefik/dynamic.dev.yml:ro
    networks: [myclash-dev]
    labels:
      - traefik.enable=true
      # Shared compress middleware (referenced by all routers)
      - traefik.http.middlewares.myclash-compress.compress=true

  # ── Postgres ─────────────────────────────────────────────────────
  db:
    image: supabase/postgres:15.6.1.115
    container_name: myclash-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-myclash}
    ports:
      - '5432:5432' # exposed for local DB tools (TablePlus, DBeaver, etc.)
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./db/init/02-supabase-realtime.sh:/docker-entrypoint-initdb.d/02-supabase-realtime.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-supabase_admin} -d ${POSTGRES_DB:-myclash}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [myclash-dev]

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: myclash-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379' # exposed for local Redis tools
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [myclash-dev]

  # ── Supabase Kong (API gateway) ──────────────────────────────────
  # Routes /auth/v1/*, /rest/v1/*, /realtime/v1/*, /storage/v1/* to the
  # appropriate Supabase services. Exposed on port 8000 for direct local
  # access and via Traefik at https://api.myclash.localhost/auth/v1/ etc.
  kong:
    image: kong:2.8.1
    container_name: myclash-dev-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    ports:
      - '8000:8000' # Kong HTTP (dev direct access)
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [myclash-dev]
    labels:
      - traefik.enable=true
      # Route Supabase sub-paths through Kong via Traefik
      - traefik.http.routers.dev-kong-auth.rule=Host(`api.myclash.localhost`) && PathPrefix(`/auth/v1`)
      - traefik.http.routers.dev-kong-auth.entrypoints=websecure
      - traefik.http.routers.dev-kong-auth.tls=true
      - traefik.http.routers.dev-kong-auth.priority=20
      - traefik.http.routers.dev-kong-auth.service=dev-kong
      - traefik.http.routers.dev-kong-rest.rule=Host(`api.myclash.localhost`) && PathPrefix(`/rest/v1`)
      - traefik.http.routers.dev-kong-rest.entrypoints=websecure
      - traefik.http.routers.dev-kong-rest.tls=true
      - traefik.http.routers.dev-kong-rest.priority=20
      - traefik.http.routers.dev-kong-rest.service=dev-kong
      - traefik.http.routers.dev-kong-realtime.rule=Host(`api.myclash.localhost`) && PathPrefix(`/realtime/v1`)
      - traefik.http.routers.dev-kong-realtime.entrypoints=websecure
      - traefik.http.routers.dev-kong-realtime.tls=true
      - traefik.http.routers.dev-kong-realtime.priority=20
      - traefik.http.routers.dev-kong-realtime.service=dev-kong
      - traefik.http.routers.dev-kong-storage.rule=Host(`api.myclash.localhost`) && PathPrefix(`/storage/v1`)
      - traefik.http.routers.dev-kong-storage.entrypoints=websecure
      - traefik.http.routers.dev-kong-storage.tls=true
      - traefik.http.routers.dev-kong-storage.priority=20
      - traefik.http.routers.dev-kong-storage.service=dev-kong
      - traefik.http.services.dev-kong.loadbalancer.server.port=8000

  # ── Supabase Auth (GoTrue) ────────────────────────────────────────
  supabase-auth:
    image: supabase/gotrue:v2.158.1
    container_name: myclash-dev-supabase-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://myclash.localhost/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev-password}@db:5432/${POSTGRES_DB:-myclash}?search_path=auth
      GOTRUE_SITE_URL: https://myclash.localhost
      GOTRUE_URI_ALLOW_LIST: https://myclash.localhost,https://app.myclash.localhost,https://admin.myclash.localhost,https://scoring.myclash.localhost,https://api.myclash.localhost/api/v1/auth/callback,http://localhost:3001/auth/oauth/callback,http://localhost:3003/auth/oauth/callback,http://localhost:3003/signup/oauth/callback
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true' # auto-confirm in dev — no SMTP needed
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://localhost:8000/auth/v1/callback
      GOTRUE_LOG_LEVEL: INFO
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      db: { condition: service_healthy }
    networks: [myclash-dev]

  # ── Supabase REST (PostgREST) ─────────────────────────────────────
  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    container_name: myclash-dev-supabase-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev-password}@db:5432/${POSTGRES_DB:-myclash}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      db: { condition: service_healthy }
    networks: [myclash-dev]

  # ── Supabase Realtime ─────────────────────────────────────────────
  supabase-realtime:
    image: supabase/realtime:v2.30.34
    container_name: myclash-dev-supabase-realtime
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-myclash}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev-password}
      DB_SSL: 'false'
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${SUPABASE_REALTIME_DB_ENC_KEY:-devrealtimedbkey}
      PORT: 4000
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      SECRET_KEY_BASE: ${SUPABASE_REALTIME_SECRET:-a-very-long-secret-key-base-for-realtime-at-least-64-chars-long-here}
      SEED_SELF_HOST: 'true'
      SELF_HOST_TENANT_NAME: realtime
      ERL_AFLAGS: '-proto_dist inet_tcp'
      ENABLE_TAILSCALE: 'false'
      DNS_NODES: "''"
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      db: { condition: service_healthy }
    networks: [myclash-dev]

  # ── Supabase Storage ──────────────────────────────────────────────
  supabase-storage:
    image: supabase/storage-api:v1.10.0
    container_name: myclash-dev-supabase-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTYxMzUzMTk4NSwiZXhwIjo0NzY5MjA1OTg1fQ.HkSBOhFBMBNFBHFBHFBHFBHFBHFBHFBHFBHFBHFBHFB}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNjEzNTMxOTg1LCJleHAiOjQ3NjkyMDU5ODV9.HkSBOhFBMBNFBHFBHFBHFBHFBHFBHFBHFBHFBHFBHFB}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev-password}@db:5432/${POSTGRES_DB:-myclash}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: myclash
      REGION: local
      GLOBAL_S3_BUCKET: myclash
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      db: { condition: service_healthy }
      supabase-rest: { condition: service_started }
    volumes:
      - dev_storage_data:/var/lib/storage
    networks: [myclash-dev]

  # ── NestJS API ────────────────────────────────────────────────────
  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: myclash-dev-api
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev-password}@db:5432/${POSTGRES_DB:-myclash}
      REDIS_URL: redis://redis:6379
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-dev-jwt-secret-change-me}
      MYCLASH_GUEST_JWT_SECRET: ${MYCLASH_GUEST_JWT_SECRET:-dev-guest-secret-change-me}
      MYCLASH_STAFF_JWT_SECRET: ${MYCLASH_STAFF_JWT_SECRET:-dev-staff-secret-change-me}
      DOMAIN: myclash.localhost
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [myclash-dev]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dev-api.rule=Host(`api.myclash.localhost`)
      - traefik.http.routers.dev-api.entrypoints=websecure
      - traefik.http.routers.dev-api.tls=true
      - traefik.http.routers.dev-api.middlewares=myclash-compress@docker
      - traefik.http.services.dev-api.loadbalancer.server.port=4000
      - traefik.http.routers.dev-admin-api.rule=Host(`admin.myclash.localhost`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.dev-admin-api.entrypoints=websecure
      - traefik.http.routers.dev-admin-api.tls=true
      - traefik.http.routers.dev-admin-api.middlewares=myclash-compress@docker
      - traefik.http.routers.dev-admin-api.priority=30
      - traefik.http.routers.dev-admin-api.service=dev-api

  # ── web-public PWA ────────────────────────────────────────────────
  web-public:
    build:
      context: ../
      dockerfile: apps/web-public/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: https://api.myclash.localhost
    container_name: myclash-dev-web-public
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      TZ: ${TZ:-Europe/Paris}
      NEXT_PUBLIC_API_URL: https://api.myclash.localhost
    depends_on:
      api: { condition: service_healthy }
    networks: [myclash-dev]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dev-public.rule=Host(`myclash.localhost`)
      - traefik.http.routers.dev-public.entrypoints=websecure
      - traefik.http.routers.dev-public.tls=true
      - traefik.http.routers.dev-public.middlewares=myclash-compress@docker
      - traefik.http.services.dev-public.loadbalancer.server.port=3000

  # ── web-scoring PWA ───────────────────────────────────────────────
  web-scoring:
    build:
      context: ../
      dockerfile: apps/web-scoring/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: https://api.myclash.localhost
    container_name: myclash-dev-web-scoring
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      api: { condition: service_healthy }
    networks: [myclash-dev]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dev-scoring.rule=Host(`scoring.myclash.localhost`)
      - traefik.http.routers.dev-scoring.entrypoints=websecure
      - traefik.http.routers.dev-scoring.tls=true
      - traefik.http.routers.dev-scoring.middlewares=myclash-compress@docker
      - traefik.http.services.dev-scoring.loadbalancer.server.port=3000

  # ── web-admin SPA ─────────────────────────────────────────────────
  web-admin:
    build:
      context: ../
      dockerfile: apps/web-admin/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: https://admin.myclash.localhost
        NEXT_PUBLIC_SCORING_URL: https://scoring.myclash.localhost
    container_name: myclash-dev-web-admin
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      api: { condition: service_healthy }
    networks: [myclash-dev]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dev-admin.rule=Host(`admin.myclash.localhost`)
      - traefik.http.routers.dev-admin.entrypoints=websecure
      - traefik.http.routers.dev-admin.tls=true
      - traefik.http.routers.dev-admin.middlewares=myclash-compress@docker
      - traefik.http.services.dev-admin.loadbalancer.server.port=3000

networks:
  myclash-dev:
    name: myclash-dev
    driver: bridge

volumes:
  dev_postgres_data:
    name: myclash-dev-postgres-data
  dev_redis_data:
    name: myclash-dev-redis-data
  dev_storage_data:
    name: myclash-dev-storage-data
