# infra/docker-compose.staging-certs.yml
#
# Overlay for testing TLS without hitting Let's Encrypt rate limits.
# Layered on top of docker-compose.prod.yml when --dev-certs is passed.
#
#   docker compose --env-file .env \
#     -f infra/docker-compose.prod.yml \
#     -f infra/docker-compose.staging-certs.yml \
#     up -d
#
# This overlay deliberately does NOT redefine traefik's `command:`. Compose
# REPLACES list-valued keys rather than merging them, so a second copy of the
# command list silently drops any prod-only flag — that is exactly how
# `--api=true` / `--api.dashboard=true` went missing and 404'd the dashboard.
# The staging CA and its acme storage file are now selected by the
# ACME_CA_SERVER / ACME_STORAGE_FILE variables that infra/scripts/deploy.sh and
# redeploy.sh export under --dev-certs. Keep it that way: check-infra-review.mjs
# fails the build if a `command:` key reappears here.
#
# What remains is the one thing with no production equivalent — server-side
# fetches must tolerate the untrusted staging chain.

services:
  api:
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: '0'

  worker:
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
