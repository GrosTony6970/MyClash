# infra/traefik/traefik.dev.yml
#
# Traefik static configuration for local development.
# Uses self-signed certificates via the built-in TLS provider.
# Loaded by docker-compose.dev.yml via --providers.file.filename.

global:
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true # dashboard at http://localhost:8080 in dev only

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'

providers:
  docker:
    exposedByDefault: false
    network: myclash-dev
  file:
    filename: /etc/traefik/dynamic.dev.yml
    watch: true

# Same plugins, same versions as prod (declared there as --experimental.* CLI
# flags, because prod has no static config file). Plugins load only at startup.
#
# Dev keeps them ALWAYS attached — no TRAEFIK_PLUGINS kill-switch — precisely so
# a broken plugin config fails here rather than in front of the live site.
experimental:
  plugins:
    geoblock:
      moduleName: github.com/PascalMinder/geoblock
      version: v0.3.8
    fail2ban:
      moduleName: github.com/tomMoulard/fail2ban
      version: v0.9.0

log:
  level: INFO
