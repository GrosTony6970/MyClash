# infra/traefik/traefik.dev.yml
#
# Traefik static configuration for local development.
# Uses self-signed certificates via the built-in TLS provider.
# Loaded by docker-compose.dev.yml via --providers.file.filename.

global:
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true   # dashboard at http://localhost:8080 in dev only

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: myclash-dev
  file:
    filename: /etc/traefik/dynamic.dev.yml
    watch: true

log:
  level: INFO
