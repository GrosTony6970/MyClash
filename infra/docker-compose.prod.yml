# infra/docker-compose.prod.yml
#
# MyClash production stack. Inherits Traefik patterns from the owner's MyFAL
# deployment (https://github.com/GrosTony6970/MyFAL).
#
# Usage:
#   docker compose --env-file .env -f infra/docker-compose.prod.yml <command>
#   (always wrap via infra/scripts/*.sh which sets the flags consistently)
#
# Conventions inherited from MyFAL:
#   - Traefik 3.6.x with label-based routing
#   - Cert resolver named "letsencrypt"
#   - Log paths under ./logs/<service>/
#   - Data paths under ./data/<service>/
#   - .env vars: DOMAIN, LETSENCRYPT_EMAIL, TZ, COMPOSE_PROJECT_NAME
#   - Container names prefixed with project name (myclash-*)
#   - Healthchecks use `node -e` HTTP probe (no curl/wget needed in image)

services:
  # ── Reverse proxy ────────────────────────────────────────────────
  traefik:
    image: traefik:v3.7.10
    container_name: myclash-traefik
    restart: unless-stopped
    command:
      - --global.sendanonymoususage=false
      - --api=true
      - --api.dashboard=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --ping=true
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      # ACME target is parameterised so the staging-certs overlay never has to
      # re-type this command list. Defaults are production; deploy.sh --dev-certs
      # exports the two vars to point at the Let's Encrypt staging CA.
      - --certificatesresolvers.letsencrypt.acme.storage=/data/${ACME_STORAGE_FILE:-acme.json}
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --providers.file.directory=/config
      # Plugins are parsed and loaded ONLY at startup, so declaring them here is
      # what makes a fresh deploy come up with them already installed — there is
      # no post-deploy install step. Traefik fetches the module source from GitHub
      # on boot into /plugins-storage (persisted below so restarts are offline).
      - --experimental.plugins.geoblock.modulename=github.com/PascalMinder/geoblock
      - --experimental.plugins.geoblock.version=v0.3.8
      - --experimental.plugins.fail2ban.modulename=github.com/tomMoulard/fail2ban
      - --experimental.plugins.fail2ban.version=v0.9.0
      # AbortOnPluginFailure is deliberately left at its default (false): a failed
      # plugin download must NOT stop Traefik from serving. It logs
      # "Plugins are disabled because an error has occurred." and boots on.
      #
      # But note what that alone would mean: with plugins disabled, a router that
      # references a plugin middleware fails to build ("middleware does not
      # exist") and serves 404 — the site would be down anyway, just silently.
      # So the plugin middlewares are attached through the ${MW_*} prefixes below,
      # which infra/scripts/lib/traefik-env.sh empties when TRAEFIK_PLUGINS=off.
      # Recovery from a failed plugin fetch is then one flag and a restart:
      #   TRAEFIK_PLUGINS=off ./infra/scripts/start.sh
      - --accesslog=true
      - --log=true
      - --log.level=INFO
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik:/data
      - ./data/traefik/plugins:/plugins-storage
      - ./logs/traefik:/logs
      - ./config/traefik:/config:ro
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      myclash:
        aliases:
          - app.${DOMAIN}
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    labels:
      - traefik.enable=true
      # Dashboard — secured with basic auth; set TRAEFIK_DASHBOARD_AUTH in .env
      # Generate credentials: echo $(htpasswd -nB admin) | sed -e 's/\$/\$\$/g'
      - traefik.http.routers.myclash-traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.myclash-traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.myclash-traefik-dashboard.tls=true
      - traefik.http.routers.myclash-traefik-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-traefik-dashboard.service=api@internal
      # api@internal only serves /api/… and /dashboard/…, so a bare root request
      # 404s. myclash-dashboard-root-redirect (file provider) sends / → /dashboard/.
      - traefik.http.routers.myclash-traefik-dashboard.middlewares=${MW_GEO_ADMIN}${MW_F2B_AUTH}myclash-dashboard-auth@docker,myclash-dashboard-root-redirect@file
      - traefik.http.middlewares.myclash-dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}

      # ── Fail2Ban middlewares ──────────────────────────────────────
      # Defined as labels, not in config/traefik/middlewares.yml, because the
      # allowlist carries the operator's real IP: labels are interpolated by
      # Compose (like TRAEFIK_DASHBOARD_AUTH above), the file provider never is.
      # That keeps the address in .env and out of this public repo.
      # TRAEFIK_BAN_ALLOWLIST is derived from THROTTLE_IP_WHITELIST by
      # infra/scripts/lib/traefik-env.sh — one trusted-IP list, not two.
      #
      # Thresholds are set by how many humans sit behind one public IP, not by
      # how strict we can be. Both are deliberately looser than the app's own
      # limiter (10/h per IP on auth routes, 600/min global — see
      # throttle-profiles.ts): this is a volumetric backstop, not the primary
      # auth control.
      #
      # BOTH JAILS RIDE LOGIN SURFACES ONLY. Counting 401/403 on a router that
      # carries authenticated APP traffic bans real people: an expired sliding
      # session emits a burst of 401s that is indistinguishable from an attack.
      # That is why myclash-admin-api has never chained one, and why
      # myclash-staff-api stopped on 2026-08-21.
      #
      # The staff surface was the worse of the two. The pad's 20-second
      # heartbeat sat in the ROOT layout, so it ran on /login and posted a 401
      # every beat from a signed-out tablet — three a minute, indefinitely,
      # against a threshold of 60 in 10 minutes, from a venue that shares one
      # NAT'd address. Two open tabs would have got there on their own. The
      # heartbeat now stops on a signed-out answer, but a jail one client bug
      # away from banning a hall is not a backstop.
      #
      # -auth — login surfaces + this dashboard. Few humans per IP, and the
      # myclash-auth router reaches GoTrue directly with NO ThrottlerGuard in
      # front of it, so this is the only rate control on that path.
      - traefik.http.middlewares.myclash-fail2ban-auth.plugin.fail2ban.allowlist.ip=${TRAEFIK_BAN_ALLOWLIST}
      - traefik.http.middlewares.myclash-fail2ban-auth.plugin.fail2ban.rules.enabled=true
      - traefik.http.middlewares.myclash-fail2ban-auth.plugin.fail2ban.rules.statuscode=401,403,429
      - traefik.http.middlewares.myclash-fail2ban-auth.plugin.fail2ban.rules.maxretry=20
      - traefik.http.middlewares.myclash-fail2ban-auth.plugin.fail2ban.rules.findtime=10m
      - traefik.http.middlewares.myclash-fail2ban-auth.plugin.fail2ban.rules.bantime=30m
      # -staff — scoring PIN login. An entire venue shares one NAT'd IP on
      # tournament day and a referee fumbling a PIN is normal, so the threshold
      # is high: 60/10m still cuts the unthrottled PIN surface from ~7,200
      # guesses/hour to ~360 without ever banning a hall full of staff.
      - traefik.http.middlewares.myclash-fail2ban-staff.plugin.fail2ban.allowlist.ip=${TRAEFIK_BAN_ALLOWLIST}
      - traefik.http.middlewares.myclash-fail2ban-staff.plugin.fail2ban.rules.enabled=true
      - traefik.http.middlewares.myclash-fail2ban-staff.plugin.fail2ban.rules.statuscode=401,403,429
      - traefik.http.middlewares.myclash-fail2ban-staff.plugin.fail2ban.rules.maxretry=60
      - traefik.http.middlewares.myclash-fail2ban-staff.plugin.fail2ban.rules.findtime=10m
      - traefik.http.middlewares.myclash-fail2ban-staff.plugin.fail2ban.rules.bantime=15m

  # ── Postgres (primary data store) ────────────────────────────────
  db:
    image: supabase/postgres:17.6.1.160
    container_name: myclash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-myclash}
      TZ: ${TZ}
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=fr-FR --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/db:/var/log/postgresql
      - ./db/init/01-supabase-roles.sh:/docker-entrypoint-initdb.d/01-supabase-roles.sh:ro
      - ./db/init/02-supabase-realtime.sh:/docker-entrypoint-initdb.d/02-supabase-realtime.sh:ro
      - ./db/init/supabase-postgrest.sh:/docker-entrypoint-initdb.d/supabase-postgrest.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-supabase_admin} -d ${POSTGRES_DB:-myclash}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks: [myclash]
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── Redis (cache + BullMQ + pub/sub) ──────────────────────────────
  redis:
    image: redis:8-alpine3.23
    container_name: myclash-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [myclash]
    mem_limit: 768m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── Supabase Auth (GoTrue) ────────────────────────────────────────
  supabase-auth:
    image: supabase/gotrue:v2.195.0
    container_name: myclash-supabase-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://app.${DOMAIN}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myclash}?search_path=auth
      GOTRUE_SITE_URL: https://app.${DOMAIN}
      # Host-wildcard (/**) entries so OAuth callbacks match WITH their ?next=
      # query string. Without them GoTrue rejects the redirect_to and falls back
      # to GOTRUE_SITE_URL (app.${DOMAIN}) — which stranded admin Google logins
      # on the public app. Host-locked to our own subdomains: no cross-host
      # open-redirect. The explicit callback paths above are kept as belt-and-braces.
      GOTRUE_URI_ALLOW_LIST: https://app.${DOMAIN},https://${DOMAIN},https://admin.${DOMAIN},https://staff.${DOMAIN},https://api.${DOMAIN}/api/v1/auth/callback,https://admin.${DOMAIN}/auth/oauth/callback,https://app.${DOMAIN}/auth/oauth/callback,https://admin.${DOMAIN}/signup/oauth/callback,https://admin.${DOMAIN}/**,https://app.${DOMAIN}/**,https://staff.${DOMAIN}/**
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      # Password policy. This is the REAL boundary, not our Zod: the
      # myclash-auth router below exposes /auth/v1/* on app.${DOMAIN}, so a
      # client can POST straight to /signup or /user and miss every DTO in the
      # repo. GoTrue's own default is 6 characters with no rules.
      #
      # Groups are ':'-delimited, which is why ':' is absent from the
      # punctuation group — a group containing the delimiter cannot be
      # expressed. ONE OWNER: this must stay character-for-character identical
      # to PASSWORD_SPECIAL_CHARS in packages/types/src/password.ts, or the
      # browser checklist ticks green on a password GoTrue then refuses.
      # `$` is doubled because compose interpolates a single one.
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: 'abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789:!"#$$%&''()*+,-./;<=>?@[\]^_`{|}~'
      # The API keeps sessions alive for ~30 days by exchanging the refresh
      # cookie (see AuthService.getMe). Rotate refresh tokens so each is
      # single-use, and revoke the whole family if a used token is replayed
      # (10s grace window covers legitimate concurrent refreshes).
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '10'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${LETSENCRYPT_EMAIL}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://app.${DOMAIN}/auth/v1/callback
      TZ: ${TZ}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:9999/health >/dev/null 2>&1 || wget -qO- http://localhost:9999/ >/dev/null 2>&1 || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [myclash]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── Supabase Realtime ─────────────────────────────────────────────
  supabase-realtime:
    image: supabase/realtime:v2.124.1
    container_name: myclash-supabase-realtime
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-myclash}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: 'false'
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${SUPABASE_REALTIME_DB_ENC_KEY}
      PORT: 4000
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      METRICS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SECRET_KEY_BASE: ${SUPABASE_REALTIME_SECRET}
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      # MUST equal the first label of the Host header Traefik forwards, i.e.
      # `app` for app.${DOMAIN}. Realtime is multi-tenant: the websocket
      # connect and every /api/* route except the path-addressed
      # /api/tenants/:id/* resolve the tenant from that label. Traefik passes
      # the client's Host through unchanged, so a tenant named `realtime`
      # meant every socket looked up a tenant called `app`, found nothing, and
      # 403'd the handshake — for months, invisibly, because the healthcheck
      # below addresses the tenant by PATH and kept returning 200.
      #
      # Kong (dropped in the 2026-07-29 parity slice) hid this: its upstream
      # URL was http://realtime-dev.supabase-realtime:4000 with preserve_host
      # off, so realtime saw a Host whose first label WAS the tenant name.
      #
      # Changing this name is a public-surface change: check
      # scripts/check-edge-tls.mjs, which probes /realtime/v1/api/ping.
      SELF_HOST_TENANT_NAME: app
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      ERL_AFLAGS: '-proto_dist inet_tcp'
      ENABLE_TAILSCALE: 'false'
      DNS_NODES: "''"
      TZ: ${TZ}
    depends_on:
      db: { condition: service_healthy }
    # The tenant is addressed by PATH here, so this probe passes even when
    # host-based tenant resolution is broken: it proves realtime is UP, never
    # that it can serve app.${DOMAIN}. That gap is covered by
    # scripts/check-edge-tls.mjs. Keep the id in step with
    # SELF_HOST_TENANT_NAME above.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sSfL --head -o /dev/null -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" http://localhost:4000/api/tenants/app/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [myclash]
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── Supabase Storage ──────────────────────────────────────────────
  supabase-storage:
    image: supabase/storage-api:v1.68.9
    container_name: myclash-supabase-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myclash}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: myclash
      REGION: local
      GLOBAL_S3_BUCKET: myclash
      TZ: ${TZ}
    depends_on:
      db: { condition: service_healthy }
      supabase-rest: { condition: service_started }
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://supabase-storage:5000/status']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [myclash]
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── PostgREST (Supabase REST API) ────────────────────────────────
  supabase-rest:
    image: postgrest/postgrest:v14.16
    container_name: myclash-supabase-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myclash}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      # db-use-legacy-gucs was REMOVED in PostgREST v13 — every supported
      # Postgres now uses the JSON-format GUCs this used to opt into, so the
      # setting has no meaning on v14. Deleted rather than left as a stale key.
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: '3600'
      TZ: ${TZ}
    depends_on:
      db: { condition: service_healthy }
    # The postgrest image is shell-less and has no guaranteed helper binaries.
    # Treat running state as the Compose dependency signal; status/deploy scripts
    # provide external diagnostics.
    networks: [myclash]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    labels:
      - traefik.enable=true
      - traefik.http.routers.myclash-rest.rule=Host(`app.${DOMAIN}`) && PathPrefix(`/rest/v1`)
      - traefik.http.routers.myclash-rest.entrypoints=websecure
      - traefik.http.routers.myclash-rest.tls=true
      - traefik.http.routers.myclash-rest.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-rest.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,myclash-rest-strip@file
      - traefik.http.routers.myclash-rest.priority=20
      - traefik.http.services.myclash-rest.loadbalancer.server.port=3000

  # ── Postgres meta API (Studio's only route to the database) ───────
  supabase-meta:
    image: supabase/postgres-meta:v0.96.8
    container_name: myclash-supabase-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-myclash}
      PG_META_DB_USER: ${POSTGRES_USER:-supabase_admin}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then(r=>{if(r.status!==200)console.error('HTTP '+r.status);process.exit(r.status===200?0:1)}).catch(e=>{console.error(e.cause?.code||e.name,e.message);process.exit(1)});",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Deliberately unrouted: no traefik labels, no published ports. This speaks
    # to Postgres as POSTGRES_USER and answers unauthenticated on the docker
    # network, so the ONLY thing that may reach it is supabase-studio.
    networks: [myclash]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── Supabase Studio (operator DB console) ─────────────────────────
  #
  # RLS EXCEPTION — read before touching this service. Studio reaches Postgres
  # through supabase-meta as POSTGRES_USER, so every query it runs BYPASSES the
  # row-level security policies that are otherwise this system's only data
  # boundary. Hard rule #4 still holds everywhere else; this is the one
  # deliberate, operator-only hole, and that is exactly why the router below is
  # gated twice.
  #
  # Self-hosted Studio ships with NO authentication of its own — upstream relies
  # on Kong for that and this stack dropped Kong. The edge is therefore the only
  # access control, which is why myclash-studio-ipallow and myclash-studio-auth
  # are BUILT-IN Traefik middlewares written out in full rather than hidden
  # behind the ${MW_*} prefixes: traefik-env.sh empties those when
  # TRAEFIK_PLUGINS=off, and a plugin outage must never be able to publish an
  # unauthenticated superuser SQL console.
  supabase-studio:
    image: supabase/studio:2026.08.03-sha-022b374
    container_name: myclash-supabase-studio
    restart: unless-stopped
    environment:
      # A Next.js standalone server binds to process.env.HOSTNAME, and the
      # container runtime injects HOSTNAME=<container id> — so without this
      # Studio listens on its own eth0 address alone. Traefik still reaches it
      # and the console looks fine, while the healthcheck below dials 127.0.0.1
      # and is refused forever. Our own Next images set this in their
      # Dockerfiles (apps/web-public/Dockerfile); an image we don't build has
      # to be told here, which is what upstream's own compose does.
      HOSTNAME: '0.0.0.0'
      STUDIO_PG_META_URL: http://supabase-meta:8080
      # Studio has TWO paths to Postgres, and this is the second one. Its
      # Database and SQL Editor pages build their own connection string and hand
      # it to pg-meta as a per-request override — which is the only reason this
      # container is given the password at all — so supabase-meta's correct
      # PG_META_DB_NAME is bypassed. Without POSTGRES_DB, Studio falls back to
      # upstream's invariant name, `postgres`: it connects to the empty
      # maintenance database and every pg-meta-backed page renders an EMPTY
      # STATE rather than an error. "No tables in schema public" on a 70-table
      # schema, and an Advisor reporting a clean bill of health on a database it
      # never read. Upstream never trips on this because their .env pins
      # POSTGRES_DB=postgres; ours is `myclash`. Host and port are literals —
      # this repo has no POSTGRES_HOST/PORT keys and every service addresses
      # Postgres as @db:5432. POSTGRES_USER_READ_WRITE only restates Studio's
      # own default today, and that is the point: the default matching by luck
      # is what caused this.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-myclash}
      POSTGRES_USER_READ_WRITE: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: MyClash
      DEFAULT_PROJECT_NAME: ${POSTGRES_DB:-myclash}
      # Reaches the gateway through the app.${DOMAIN} network alias declared on
      # the traefik service, so this resolves inside the compose network and
      # still presents the real Let's Encrypt certificate.
      SUPABASE_URL: https://app.${DOMAIN}
      SUPABASE_PUBLIC_URL: https://app.${DOMAIN}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      NEXT_PUBLIC_ENABLE_LOGS: 'false'
      TZ: ${TZ}
    depends_on:
      supabase-meta: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/platform/profile').then(r=>{if(r.status!==200)console.error('HTTP '+r.status);process.exit(r.status===200?0:1)}).catch(e=>{console.error(e.cause?.code||e.name,e.message);process.exit(1)});",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [myclash]
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    labels:
      - traefik.enable=true
      - traefik.http.routers.myclash-studio.rule=Host(`studio.${DOMAIN}`)
      - traefik.http.routers.myclash-studio.entrypoints=websecure
      - traefik.http.routers.myclash-studio.tls=true
      - traefik.http.routers.myclash-studio.tls.certresolver=letsencrypt
      # Order matters: the IP allowlist rejects before the password prompt is
      # ever shown, so a wrong-network client never learns a login exists.
      # The two @docker middlewares below are NOT optional and NOT prefixed —
      # see the header comment.
      - traefik.http.routers.myclash-studio.middlewares=${MW_GEO_ADMIN}${MW_F2B_AUTH}myclash-studio-ipallow@docker,myclash-studio-auth@docker,myclash-security-headers@file
      - traefik.http.middlewares.myclash-studio-ipallow.ipallowlist.sourcerange=${TRAEFIK_STUDIO_ALLOWLIST}
      - traefik.http.middlewares.myclash-studio-auth.basicauth.users=${STUDIO_BASIC_AUTH}
      - traefik.http.services.myclash-studio.loadbalancer.server.port=3000

  # ── NestJS API ────────────────────────────────────────────────────
  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
      # No build args on purpose: nothing in the builder stage reads GIT_COMMIT,
      # and passing it made every RUN layer miss the cache on every commit (see
      # the comment on the builder stage in apps/api/Dockerfile). The commit is
      # a RUNTIME value — it is in the `environment:` block below.
    container_name: myclash-api
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myclash}
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: https://app.${DOMAIN}
      SUPABASE_AUTH_INTERNAL_URL: http://supabase-auth:9999
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MYCLASH_GUEST_JWT_SECRET: ${MYCLASH_GUEST_JWT_SECRET}
      MYCLASH_STAFF_JWT_SECRET: ${MYCLASH_STAFF_JWT_SECRET}
      # AuthGuard: 'shadow' logs the 401 it would have thrown, 'enforce' throws.
      # Defaults to shadow in code when unset. Set on the worker too so the two
      # can never diverge if it ever serves HTTP.
      AUTH_GUARD_MODE: ${AUTH_GUARD_MODE:-shadow}
      COOKIE_SECRET: ${COOKIE_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      DOMAIN: ${DOMAIN}
      # Days-until-expiry threshold below which the TLS monitor + admin card
      # flag a certificate as "expiring soon" (default 21).
      TLS_CERT_MIN_DAYS: ${TLS_CERT_MIN_DAYS:-21}
      TZ: ${TZ}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      HEMA_RATINGS_SYNC_ENABLED: ${HEMA_RATINGS_SYNC_ENABLED:-true}
      # Comma-separated client IPs exempt from the global rate limit (bulk
      # imports, demo population). Read by app.module.ts; without this
      # passthrough a value in .env never reached the container.
      THROTTLE_IP_WHITELIST: ${THROTTLE_IP_WHITELIST:-}
      OPS_RUNNER_URL: http://ops-runner:4075
      OPS_RUNNER_SECRET: ${OPS_RUNNER_SECRET}
      BACKUP_UPLOAD_MAX_BYTES: ${BACKUP_UPLOAD_MAX_BYTES:-1073741824}
      MULTIPART_MAX_BYTES: ${MULTIPART_MAX_BYTES:-1073741824}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      SENTRY_DSN_API: ${SENTRY_DSN_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      AI_KEY_SECRET: ${AI_KEY_SECRET}
      # Gate-health card. Both optional: absent means unauthenticated GitHub
      # reads (60/h per IP), which the ten-minute cache stays well inside. The
      # worker never serves this endpoint, so it is passed to the api only.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      SYSTEM_VERSIONS_ROOT_DIR: /app
      SYSTEM_VERSIONS_PATH: /app/data/system-versions.json
    # Healthcheck lives in apps/api/Dockerfile — same probe, same timings, one
    # owner. Overriding it here only makes sense when this stack needs different
    # behaviour from the image, as dev does (faster interval) and web-public does
    # (a deeper probe). `worker` runs this same image and has always relied on it.
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Compose's project directory is the directory of the FIRST -f file, i.e.
    # infra/ — not the repo root the deploy scripts run from. So `./x` here means
    # infra/x and `../x` means the repo root. That mismatch is not theoretical: the
    # manifest mount below used to read `./data/system-versions.json`, so Compose
    # bound infra/data/system-versions.json while deploy.sh wrote the file at the
    # repo root. Compose auto-created a DIRECTORY at the missing source, the API's
    # EISDIR guard degraded to its fallback manifest, and the board reported
    # "unknown" for the deploy date, deployer and backup file with nothing failing.
    # Runtime state written by the deploy scripts (this manifest, backups/,
    # .last-deploy.json) lives at the repo root — hence `../`, the same idiom
    # `context: ../` and the ops-runner's `../:/srv/myclash` already use.
    # `./logs/api` stays as-is deliberately: nothing reads it (the API logs to
    # stdout), so pointing it elsewhere would be churn.
    volumes:
      - ./logs/api:/app/logs
      - ../data/system-versions.json:/app/data/system-versions.json:ro
    networks: [myclash]
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    labels:
      - traefik.enable=true
      - traefik.http.routers.myclash-api.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.myclash-api.entrypoints=websecure
      - traefik.http.routers.myclash-api.tls=true
      - traefik.http.routers.myclash-api.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-api.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,myclash-compress@file
      - traefik.http.routers.myclash-api.service=myclash-api
      - traefik.http.services.myclash-api.loadbalancer.server.port=4000
      - traefik.http.routers.myclash-admin-api.rule=Host(`admin.${DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.myclash-admin-api.entrypoints=websecure
      - traefik.http.routers.myclash-admin-api.tls=true
      - traefik.http.routers.myclash-admin-api.tls.certresolver=letsencrypt
      # NOT behind fail2ban on purpose: with sliding 30-day sessions an expired
      # cookie makes one dashboard load emit a burst of parallel 401s that the
      # client then resolves by refreshing — indistinguishable from an attack by
      # status code alone. The admin country allow-list is the control here.
      - traefik.http.routers.myclash-admin-api.middlewares=${MW_GEO_ADMIN}myclash-security-headers@file,myclash-compress@file
      - traefik.http.routers.myclash-admin-api.priority=30
      - traefik.http.routers.myclash-admin-api.service=myclash-api
      # Public app same-origin API: app.${DOMAIN}/api/v1/* → API container.
      # Mirrors the admin pattern above. Lets the browser bundle call the API
      # on the same origin it loaded from, sidestepping the api.${DOMAIN}
      # cert (dev/untrusted in this deploy) entirely.
      - traefik.http.routers.myclash-public-api.rule=Host(`app.${DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.myclash-public-api.entrypoints=websecure
      - traefik.http.routers.myclash-public-api.tls=true
      - traefik.http.routers.myclash-public-api.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-public-api.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,myclash-compress@file
      - traefik.http.routers.myclash-public-api.priority=30
      - traefik.http.routers.myclash-public-api.service=myclash-api
      # Scoring same-origin API: staff.${DOMAIN}/api/v1/* → API container.
      # Needed so the scoring bundle (which fetches relative /api/v1 paths
      # via getApiUrl()) keeps working when loaded from its own host. The
      # admin proxy at admin.${DOMAIN}/scoring/* relies on the existing
      # myclash-admin-api router for its /api/v1 calls — no new router
      # there.
      - traefik.http.routers.myclash-staff-api.rule=Host(`staff.${DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.myclash-staff-api.entrypoints=websecure
      - traefik.http.routers.myclash-staff-api.tls=true
      - traefik.http.routers.myclash-staff-api.tls.certresolver=letsencrypt
      # NO FAIL2BAN HERE. This router carries every authenticated call the pad
      # makes, and the -staff jail counts 401/403 — one client bug away from
      # banning a whole venue, which shares one NAT'd address. See the jail
      # block above for how close it got. Rate control on this surface is the
      # API's own ThrottlerGuard (600/min per IP) plus @ThrottleByStaffAccount
      # on the login route, and both answer 429 to the one caller rather than
      # banning the address for everyone behind it.
      - traefik.http.routers.myclash-staff-api.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,myclash-compress@file
      - traefik.http.routers.myclash-staff-api.priority=30
      - traefik.http.routers.myclash-staff-api.service=myclash-api
      # ── Staff PIN login, jailed on EVERY host ────────────────────────────
      # Four routers above reach this same API container, and only
      # myclash-staff-api carried the jail — so POST /api/v1/staff-auth/login
      # answered unjailed on api., app. AND admin. These two close that, and
      # the first is deliberately HOST-LESS: a fifth host added to the API
      # later cannot silently reopen the hole.
      #
      # Priority 40 beats the explicit 30 on the three PathPrefix routers and
      # the rule-length default (~22) on myclash-api. Traefik's own default
      # would already put this at 32 and win, but leaving that implicit makes
      # the ordering an accident of string length rather than a decision.
      - traefik.http.routers.myclash-staff-auth.rule=PathPrefix(`/api/v1/staff-auth`)
      - traefik.http.routers.myclash-staff-auth.entrypoints=websecure
      - traefik.http.routers.myclash-staff-auth.tls=true
      - traefik.http.routers.myclash-staff-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-staff-auth.middlewares=${MW_GEO_PUBLIC}${MW_F2B_STAFF}myclash-security-headers@file,myclash-compress@file
      - traefik.http.routers.myclash-staff-auth.priority=40
      - traefik.http.routers.myclash-staff-auth.service=myclash-api
      # admin. keeps MW_GEO_ADMIN. Without this second router the host-less one
      # above would win on admin. too and quietly move that path from the admin
      # country allow-list to the public one — a widening, not a fix.
      - traefik.http.routers.myclash-staff-auth-admin.rule=Host(`admin.${DOMAIN}`) && PathPrefix(`/api/v1/staff-auth`)
      - traefik.http.routers.myclash-staff-auth-admin.entrypoints=websecure
      - traefik.http.routers.myclash-staff-auth-admin.tls=true
      - traefik.http.routers.myclash-staff-auth-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-staff-auth-admin.middlewares=${MW_GEO_ADMIN}${MW_F2B_STAFF}myclash-security-headers@file,myclash-compress@file
      - traefik.http.routers.myclash-staff-auth-admin.priority=50
      - traefik.http.routers.myclash-staff-auth-admin.service=myclash-api
      # Auth + Realtime + Storage routed through the PWA host on /auth/v1/* /realtime/v1/* /storage/v1/*
      # StripPrefix middlewares replicate Kong's strip_path behaviour: the upstream Supabase
      # services serve unprefixed routes (e.g. POST /bucket, not POST /storage/v1/bucket).
      # Realtime: supabase/realtime v2.94 serves its Phoenix socket at
      # /socket/websocket and its REST API at /api/* — NOT under /realtime/v1.
      # The browser client (supabase-js) connects to /realtime/v1/websocket, so
      # we replicate Kong's realtime routes: rewrite /realtime/v1/api/* -> /api/*
      # and the rest of /realtime/v1/* -> /socket/* (so /realtime/v1/websocket ->
      # /socket/websocket). Passing /realtime/v1 through unchanged 404s at the
      # realtime app. ($$ escapes compose interpolation so Traefik sees $1.)
      - traefik.http.middlewares.supabase-auth-strip.stripprefix.prefixes=/auth/v1
      - traefik.http.middlewares.supabase-storage-strip.stripprefix.prefixes=/storage/v1
      - traefik.http.middlewares.supabase-realtime-ws.replacepathregex.regex=^/realtime/v1/(.*)
      - traefik.http.middlewares.supabase-realtime-ws.replacepathregex.replacement=/socket/$$1
      - traefik.http.middlewares.supabase-realtime-api.replacepathregex.regex=^/realtime/v1/api/(.*)
      - traefik.http.middlewares.supabase-realtime-api.replacepathregex.replacement=/api/$$1
      - traefik.http.routers.myclash-auth.rule=Host(`app.${DOMAIN}`) && PathPrefix(`/auth/v1`)
      - traefik.http.routers.myclash-auth.entrypoints=websecure
      - traefik.http.routers.myclash-auth.tls=true
      - traefik.http.routers.myclash-auth.tls.certresolver=letsencrypt
      # Proxies straight to GoTrue — Nest's ThrottlerGuard is NOT in this path,
      # so fail2ban is the only rate control on /auth/v1/*.
      - traefik.http.routers.myclash-auth.middlewares=${MW_GEO_PUBLIC}${MW_F2B_AUTH}myclash-security-headers@file,supabase-auth-strip
      - traefik.http.routers.myclash-auth.priority=20
      - traefik.http.routers.myclash-auth.service=myclash-supabase-auth
      - traefik.http.services.myclash-supabase-auth.loadbalancer.server.url=http://supabase-auth:9999
      # Realtime REST (broadcast/presence): /realtime/v1/api/* -> /api/*. Higher
      # priority than the websocket router so the more specific /api prefix wins.
      - traefik.http.routers.myclash-realtime-api.rule=Host(`app.${DOMAIN}`) && PathPrefix(`/realtime/v1/api`)
      - traefik.http.routers.myclash-realtime-api.entrypoints=websecure
      - traefik.http.routers.myclash-realtime-api.tls=true
      - traefik.http.routers.myclash-realtime-api.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-realtime-api.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,supabase-realtime-api
      - traefik.http.routers.myclash-realtime-api.priority=25
      - traefik.http.routers.myclash-realtime-api.service=myclash-supabase-realtime
      # Realtime WebSocket: /realtime/v1/* -> /socket/* (the actual Phoenix mount).
      - traefik.http.routers.myclash-realtime.rule=Host(`app.${DOMAIN}`) && PathPrefix(`/realtime/v1`)
      - traefik.http.routers.myclash-realtime.entrypoints=websecure
      - traefik.http.routers.myclash-realtime.tls=true
      - traefik.http.routers.myclash-realtime.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-realtime.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,supabase-realtime-ws
      - traefik.http.routers.myclash-realtime.priority=20
      - traefik.http.routers.myclash-realtime.service=myclash-supabase-realtime
      - traefik.http.services.myclash-supabase-realtime.loadbalancer.server.url=http://supabase-realtime:4000
      - traefik.http.routers.myclash-storage.rule=Host(`app.${DOMAIN}`) && PathPrefix(`/storage/v1`)
      - traefik.http.routers.myclash-storage.entrypoints=websecure
      - traefik.http.routers.myclash-storage.tls=true
      - traefik.http.routers.myclash-storage.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-storage.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,supabase-storage-strip
      - traefik.http.routers.myclash-storage.priority=20
      - traefik.http.routers.myclash-storage.service=myclash-supabase-storage
      - traefik.http.services.myclash-supabase-storage.loadbalancer.server.url=http://supabase-storage:5000
      # Admin same-origin proxy for storage: admin.${DOMAIN}/storage/v1/*
      # → supabase-storage (with /storage/v1 stripped to match the
      # upstream's unprefixed routes). Lets the admin's IMG elements
      # load org logos / event assets without crossing origins, which
      # avoids the cross-origin app.${DOMAIN} roundtrip and keeps cookies
      # consistent with the admin surface if the bucket is later made
      # non-public.
      - traefik.http.routers.myclash-admin-storage.rule=Host(`admin.${DOMAIN}`) && PathPrefix(`/storage/v1`)
      - traefik.http.routers.myclash-admin-storage.entrypoints=websecure
      - traefik.http.routers.myclash-admin-storage.tls=true
      - traefik.http.routers.myclash-admin-storage.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-admin-storage.middlewares=${MW_GEO_ADMIN}myclash-security-headers@file,supabase-storage-strip
      - traefik.http.routers.myclash-admin-storage.priority=20
      - traefik.http.routers.myclash-admin-storage.service=myclash-supabase-storage

  # ── Internal ops runner (backup/restore allowlist) ─────────────
  ops-runner:
    build:
      context: ../
      dockerfile: infra/ops-runner/Dockerfile
    container_name: myclash-ops-runner
    restart: unless-stopped
    working_dir: /srv/myclash
    environment:
      NODE_ENV: production
      OPS_RUNNER_PORT: 4075
      OPS_RUNNER_SECRET: ${OPS_RUNNER_SECRET}
      MYCLASH_ROOT_DIR: /srv/myclash
      BACKUP_SCW_ACCESS_KEY: ${BACKUP_SCW_ACCESS_KEY:-}
      BACKUP_SCW_SECRET_KEY: ${BACKUP_SCW_SECRET_KEY:-}
      BACKUP_SCW_BUCKET: ${BACKUP_SCW_BUCKET:-}
      BACKUP_SCW_REGION: ${BACKUP_SCW_REGION:-fr-par}
      BACKUP_SCW_ENDPOINT: ${BACKUP_SCW_ENDPOINT:-}
      TZ: ${TZ}
    volumes:
      - ../:/srv/myclash
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('http');const s=process.env.OPS_RUNNER_SECRET;const req=http.get({host:'localhost',port:4075,path:'/status',headers:{authorization:`Bearer $${s}`}},r=>{if(r.statusCode!==200)console.error('HTTP '+r.statusCode);process.exit(r.statusCode===200?0:1)});req.on('error',e=>{console.error(e.code||e.name,e.message);process.exit(1)});",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [myclash]
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── Worker (BullMQ jobs: stats, exports, notifications, ratings) ──
  worker:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
      # Same image as the api service, and deliberately the same (empty) build
      # args — differing args would fork the two into separate builds of an
      # identical Dockerfile. See the api service above.
    container_name: myclash-worker
    restart: unless-stopped
    command: ['node', 'dist/main.js', '--worker']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myclash}
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: https://app.${DOMAIN}
      SUPABASE_AUTH_INTERNAL_URL: http://supabase-auth:9999
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MYCLASH_GUEST_JWT_SECRET: ${MYCLASH_GUEST_JWT_SECRET}
      MYCLASH_STAFF_JWT_SECRET: ${MYCLASH_STAFF_JWT_SECRET}
      # AuthGuard: 'shadow' logs the 401 it would have thrown, 'enforce' throws.
      # Defaults to shadow in code when unset. Set on the worker too so the two
      # can never diverge if it ever serves HTTP.
      AUTH_GUARD_MODE: ${AUTH_GUARD_MODE:-shadow}
      COOKIE_SECRET: ${COOKIE_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      DOMAIN: ${DOMAIN}
      # The daily TLS certificate monitor (BullMQ job) can run in this container;
      # it emails LETSENCRYPT_EMAIL on trouble and flags certs within N days.
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      TLS_CERT_MIN_DAYS: ${TLS_CERT_MIN_DAYS:-21}
      TZ: ${TZ}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      SENTRY_DSN_API: ${SENTRY_DSN_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      AI_KEY_SECRET: ${AI_KEY_SECRET}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./logs/worker:/app/logs
    networks: [myclash]
    mem_limit: 768m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── web-public PWA (mobile-first, public/spectator/competitor) ────
  web-public:
    build:
      context: ../
      dockerfile: apps/web-public/Dockerfile
      args:
        # No GIT_COMMIT / SENTRY_RELEASE here: a per-commit build arg invalidates
        # every RUN layer of the builder stage, so the whole `next build` ran
        # again on every deploy even when nothing in this app had changed. Both
        # values still reach the container through `environment:` below.
        # Same-origin API: browser bundle calls app.${DOMAIN}/api/v1/*
        # via the myclash-public-api Traefik router (see api service labels).
        # Avoids the api.${DOMAIN} cross-origin path entirely.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_PUBLIC}
        # Cross-app link target for competitors who also hold an organiser /
        # super-admin grant (SiteHeader + PublicPersonalShell "Admin workspace").
        NEXT_PUBLIC_ADMIN_URL: https://admin.${DOMAIN}
        # Marketing origin (apex host) — the terms + privacy policy the
        # footer and the signup form link to live there, not in this app.
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL}
        # Staff sign-in target: the display hub (/e/<slug>/display) and the
        # kiosk control layer link referees to the scoring pad — the public
        # app's own Sign in cannot produce a staff session.
        NEXT_PUBLIC_STAFF_URL: ${NEXT_PUBLIC_STAFF_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN_PUBLIC: ${NEXT_PUBLIC_SENTRY_DSN_PUBLIC:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
        # Build-time ONLY (source-map upload). Never mirrored into the
        # environment: block below — it must not ship in the image / reach browsers.
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    container_name: myclash-web-public
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      # Same-origin API (see build-arg comment above).
      NEXT_PUBLIC_API_URL: https://app.${DOMAIN}
      # Server-side fetches (SSR + route handlers) use the internal
      # docker service name. The public hostname doesn't hairpin
      # cleanly from inside the container — it resolves to 127.0.0.1
      # which has no listener. See apps/web-public/src/lib/api-url.ts.
      API_URL_INTERNAL: http://api:4000
      # This app's own public origin, for the absolute URLs it has to emit:
      # sitemap.xml, the Sitemap: line in robots.txt, and every canonical/OG
      # tag via metadataBase. Server-only, so NOT a build arg and NOT
      # NEXT_PUBLIC_ — nothing here is inlined into the browser bundle, and
      # changing it needs no image rebuild. See apps/web-public/src/lib/app-origin.ts.
      PUBLIC_APP_ORIGIN: https://app.${DOMAIN}
      NEXT_PUBLIC_SENTRY_DSN_PUBLIC: ${NEXT_PUBLIC_SENTRY_DSN_PUBLIC:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      # No NEXT_PUBLIC_SENTRY_RELEASE: a NEXT_PUBLIC_* value only reaches the
      # browser if `next build` inlined it, so setting it here read as a browser
      # release tag while doing nothing. Server-side events take their release
      # from SENTRY_RELEASE / GIT_COMMIT below.
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    # The healthcheck below asserts a CROSS-SERVICE invariant, so without this
    # gate it is guaranteed to fail on every cold start: compose used to bring
    # this app up in parallel with the db → api chain, the probe fired ~30s
    # later against an API that was still booting, and two
    # `[health/api-reachable] … ECONNREFUSED` lines were left at the tail of
    # `status.sh` for the rest of the container's life. Gating the start adds no
    # new availability rule — the probe already defines "no reachable API" as
    # unhealthy. docker-compose.dev.yml has had this on all three web apps from
    # the beginning; prod is what drifted. (Docker's restart policy ignores
    # depends_on, so a host reboot still races; that is what the timestamps in
    # status.sh are for.)
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # Deeper probe than /api/health (which only verifies Next is alive).
      # /api/health/api-reachable performs the same server-side fetch the
      # public pages do — if SSR can't reach the API for ANY reason (DNS,
      # routing, TLS, hairpin), this returns 503 and the container goes
      # unhealthy. Deploy script's healthcheck poll then fails fast,
      # preventing a broken public site from going live.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health/api-reachable',r=>{if(r.statusCode!==200)console.error('HTTP '+r.statusCode);process.exit(r.statusCode===200?0:1)}).on('error',e=>{console.error(e.code||e.name,e.message);process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [myclash]
    mem_limit: 768m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    labels:
      - traefik.enable=true
      - traefik.http.routers.myclash-public.rule=Host(`app.${DOMAIN}`)
      - traefik.http.routers.myclash-public.entrypoints=websecure
      - traefik.http.routers.myclash-public.tls=true
      - traefik.http.routers.myclash-public.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-public.priority=1
      - traefik.http.routers.myclash-public.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,myclash-compress@file
      - traefik.http.services.myclash-public.loadbalancer.server.port=3000

  # ── web-marketing (static landing site at apex) ───────────────────
  # Lightweight static site served by Caddy (or nginx). Holds the
  # marketing/landing pages, "for organizers" pitch, public docs,
  # and "go to app" / "go to admin" CTAs. No build complexity.
  web-marketing:
    build:
      # Repo root: Astro needs the workspace lockfile to install.
      context: ..
      dockerfile: apps/web-marketing/Dockerfile
      args:
        # Read by the browser for the adoption counts above the fold. Inlined
        # by `astro build`, so it is a build arg and not an `environment:` key.
        PUBLIC_API_URL: https://api.${DOMAIN}
    container_name: myclash-web-marketing
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/ | head -c 100 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [myclash]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    labels:
      - traefik.enable=true
      - traefik.http.routers.myclash-marketing.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.myclash-marketing.entrypoints=websecure
      - traefik.http.routers.myclash-marketing.tls=true
      - traefik.http.routers.myclash-marketing.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-marketing.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,myclash-compress@file,myclash-www-redirect@docker
      - traefik.http.services.myclash-marketing.loadbalancer.server.port=80
      # Redirect www → apex
      - traefik.http.middlewares.myclash-www-redirect.redirectregex.regex=^https?://www\.${DOMAIN}/(.*)
      - traefik.http.middlewares.myclash-www-redirect.redirectregex.replacement=https://${DOMAIN}/$${1}
      - traefik.http.middlewares.myclash-www-redirect.redirectregex.permanent=true

  # ── web-staff PWA (tablet-first, offline-first scorekeeper) ─────
  web-staff:
    build:
      context: ../
      dockerfile: apps/web-staff/Dockerfile
      args:
        # No GIT_COMMIT / SENTRY_RELEASE here: a per-commit build arg invalidates
        # every RUN layer of the builder stage, so the whole `next build` ran
        # again on every deploy even when nothing in this app had changed. Both
        # values still reach the container through `environment:` below.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_STAFF}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_PUBLIC_APP_URL: ${NEXT_PUBLIC_PUBLIC_APP_URL}
        NEXT_PUBLIC_SENTRY_DSN_SCORING: ${NEXT_PUBLIC_SENTRY_DSN_SCORING:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
        # Build-time ONLY (source-map upload). Never mirrored into the
        # environment: block below — it must not ship in the image / reach browsers.
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        # Mounted under /scoring on both admin.${DOMAIN} (via the
        # myclash-admin-staff stripprefix router) and staff.${DOMAIN}
        # (via the myclash-staff-prefixed sibling router below). Next
        # emits static chunks under this prefix so Traefik routes them
        # to the scoring container instead of admin's catch-all.
        STAFF_ASSET_PREFIX: /staff
    container_name: myclash-web-staff
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      NEXT_PUBLIC_SENTRY_DSN_SCORING: ${NEXT_PUBLIC_SENTRY_DSN_SCORING:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      # No NEXT_PUBLIC_SENTRY_RELEASE: a NEXT_PUBLIC_* value only reaches the
      # browser if `next build` inlined it, so setting it here read as a browser
      # release tag while doing nothing. Server-side events take their release
      # from SENTRY_RELEASE / GIT_COMMIT below.
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    # One rule for the whole web tier — see web-public for why.
    depends_on:
      api: { condition: service_healthy }
    # Healthcheck lives in apps/web-staff/Dockerfile — one owner. See the api
    # service for when overriding it here is the right call.
    networks: [myclash]
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    labels:
      - traefik.enable=true
      - traefik.http.routers.myclash-staff.rule=Host(`staff.${DOMAIN}`)
      - traefik.http.routers.myclash-staff.entrypoints=websecure
      - traefik.http.routers.myclash-staff.tls=true
      - traefik.http.routers.myclash-staff.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-staff.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,myclash-compress@file
      - traefik.http.services.myclash-staff.loadbalancer.server.port=3000
      # Admin same-origin proxy: admin.${DOMAIN}/scoring/* → scoring
      # container with /scoring stripped. Lets the organizer click a
      # match and land on the interactive scoring PWA inside admin
      # (same-origin cookie, no cross-origin dev-cert prompt). The
      # scoring bundle's relative-path fetches resolve to
      # admin.${DOMAIN}/api/v1/* which the existing myclash-admin-api
      # router already serves.
      - traefik.http.middlewares.myclash-admin-staff-strip.stripprefix.prefixes=/staff
      - traefik.http.routers.myclash-admin-staff.rule=Host(`admin.${DOMAIN}`) && PathPrefix(`/staff`)
      - traefik.http.routers.myclash-admin-staff.entrypoints=websecure
      - traefik.http.routers.myclash-admin-staff.tls=true
      - traefik.http.routers.myclash-admin-staff.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-admin-staff.middlewares=${MW_GEO_ADMIN}myclash-security-headers@file,myclash-compress@file,myclash-admin-staff-strip
      - traefik.http.routers.myclash-admin-staff.priority=30
      - traefik.http.routers.myclash-admin-staff.service=myclash-staff
      # Subdomain-prefixed assets: staff.${DOMAIN}/scoring/_next/* →
      # scoring container with /scoring stripped. Pairs with the
      # STAFF_ASSET_PREFIX build arg so the HTML served on the
      # canonical scoring subdomain can still resolve its own
      # /scoring-prefixed chunks. The bare myclash-staff router
      # above keeps serving non-prefixed paths (staff.${DOMAIN}/,
      # staff.${DOMAIN}/matches/<id>) so scorekeeper bookmarks and
      # the tablet-PWA entry point keep working.
      - traefik.http.middlewares.myclash-staff-subdomain-strip.stripprefix.prefixes=/staff
      - traefik.http.routers.myclash-staff-prefixed.rule=Host(`staff.${DOMAIN}`) && PathPrefix(`/staff`)
      - traefik.http.routers.myclash-staff-prefixed.entrypoints=websecure
      - traefik.http.routers.myclash-staff-prefixed.tls=true
      - traefik.http.routers.myclash-staff-prefixed.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-staff-prefixed.middlewares=${MW_GEO_PUBLIC}myclash-security-headers@file,myclash-compress@file,myclash-staff-subdomain-strip
      - traefik.http.routers.myclash-staff-prefixed.priority=30
      - traefik.http.routers.myclash-staff-prefixed.service=myclash-staff

  # ── web-admin SPA (organizer + super admin) ───────────────────────
  web-admin:
    build:
      context: ../
      dockerfile: apps/web-admin/Dockerfile
      args:
        # No GIT_COMMIT / SENTRY_RELEASE here: a per-commit build arg invalidates
        # every RUN layer of the builder stage, so the whole `next build` ran
        # again on every deploy even when nothing in this app had changed. Both
        # values still reach the container through `environment:` below.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_ADMIN}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_STAFF_URL: ${NEXT_PUBLIC_STAFF_URL}
        NEXT_PUBLIC_PUBLIC_APP_URL: ${NEXT_PUBLIC_PUBLIC_APP_URL}
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL}
        NEXT_PUBLIC_SENTRY_DSN_ADMIN: ${NEXT_PUBLIC_SENTRY_DSN_ADMIN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
        # Build-time ONLY (source-map upload). Never mirrored into the
        # environment: block below — it must not ship in the image / reach browsers.
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    container_name: myclash-web-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      NEXT_PUBLIC_SENTRY_DSN_ADMIN: ${NEXT_PUBLIC_SENTRY_DSN_ADMIN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      # No NEXT_PUBLIC_SENTRY_RELEASE: a NEXT_PUBLIC_* value only reaches the
      # browser if `next build` inlined it, so setting it here read as a browser
      # release tag while doing nothing. Server-side events take their release
      # from SENTRY_RELEASE / GIT_COMMIT below.
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    # One rule for the whole web tier — see web-public for why.
    depends_on:
      api: { condition: service_healthy }
    # Healthcheck lives in apps/web-admin/Dockerfile — one owner. See the api
    # service for when overriding it here is the right call.
    networks: [myclash]
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    labels:
      - traefik.enable=true
      - traefik.http.routers.myclash-admin.rule=Host(`admin.${DOMAIN}`)
      - traefik.http.routers.myclash-admin.entrypoints=websecure
      - traefik.http.routers.myclash-admin.tls=true
      - traefik.http.routers.myclash-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.myclash-admin.middlewares=${MW_GEO_ADMIN}myclash-security-headers@file,myclash-compress@file
      # Low priority so every prefixed admin sub-router out-ranks this
      # catch-all. Without it, Traefik's computed priority (rule length
      # ~24) beats myclash-admin-storage (explicit priority=20), so
      # admin.${DOMAIN}/storage/v1/* hit the Next app (404) instead of
      # Supabase storage — org-logo <img> rendered blank. Mirrors
      # myclash-public.priority=1. (api/scoring use priority=30 so they
      # already won; only storage at 20 lost.)
      - traefik.http.routers.myclash-admin.priority=1
      - traefik.http.services.myclash-admin.loadbalancer.server.port=3000

networks:
  myclash:
    name: myclash
    driver: bridge

volumes:
  postgres_data:
    name: myclash-postgres-data
  redis_data:
    name: myclash-redis-data
  storage_data:
    name: myclash-storage-data
