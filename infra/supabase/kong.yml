# infra/supabase/kong.yml
#
# Kong declarative configuration for the self-hosted Supabase API gateway.
# Routes /auth/v1/*, /rest/v1/*, /realtime/v1/*, /storage/v1/* to the
# appropriate Supabase services.
#
# Used by both docker-compose.dev.yml and docker-compose.prod.yml.
# Kong runs in DB-less mode (declarative config only).

_format_version: '2.1'
_transform: true

###############################################################################
# Services
###############################################################################

services:
  # ── Auth (GoTrue) ──────────────────────────────────────────────────────────
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  # ── REST (PostgREST) ───────────────────────────────────────────────────────
  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  # ── Realtime ───────────────────────────────────────────────────────────────
  - name: realtime-v1
    url: http://supabase-realtime:4000/
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  # ── Storage ────────────────────────────────────────────────────────────────
  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

###############################################################################
# Plugins (global)
###############################################################################

plugins:
  - name: cors
    config:
      origins:
        - '*'
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - apikey
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
