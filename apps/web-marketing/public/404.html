<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — MyClash</title>
  <!-- Served for any unknown path, so it is deliberately not indexable: the
       alternative is a crawler filing one "page" per typo. -->
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/assets/Logomini_nobackground.png" type="image/png">
  <style>
    /* System serif stack, not the site's Cinzel/Cormorant. Those come from
       fonts.googleapis.com, which sends the visitor's IP to Google — a transfer
       the privacy policy does not disclose. A 404 page is not worth adding a
       fourth one to, and this file has to work when nothing else resolved. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: #0f172a;
      color: #f1f5f9;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      line-height: 1.6;
      text-align: center;
    }
    main { max-width: 34rem; }
    .code {
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 900;
      line-height: 1;
      color: #dc2626;
      letter-spacing: 0.04em;
    }
    .rule {
      width: 48px;
      height: 3px;
      background: #f59e0b;
      margin: 1.5rem auto;
    }
    h1 {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.75rem;
    }
    p { color: rgba(241, 245, 249, 0.75); }
    p + p { margin-top: 0.4rem; }
    .en { font-style: italic; color: rgba(241, 245, 249, 0.55); }
    nav {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2.5rem;
    }
    nav a {
      padding: 0.7rem 1.6rem;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 4px;
      color: #ffffff;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.2s, background 0.2s;
    }
    nav a:first-child {
      background: #dc2626;
      border-color: #dc2626;
    }
    nav a:hover { border-color: #ffffff; background: rgba(255, 255, 255, 0.12); }
    nav a:first-child:hover { background: #b91c1c; border-color: #b91c1c; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <div class="rule" aria-hidden="true"></div>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être obsolète, ou l'adresse comporte une faute de frappe.</p>
    <p class="en" lang="en">This page does not exist. The link may be out of date, or the address mistyped.</p>
    <nav aria-label="Retour / Back">
      <a href="/">Accueil</a>
      <a href="/en/">English</a>
      <a href="https://app.myclash.fr">Application</a>
    </nav>
  </main>
</body>
</html>
