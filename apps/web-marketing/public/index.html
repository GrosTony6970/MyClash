<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyClash — HEMA Event Management</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2rem;
        text-align: center;
      }
      h1 { font-size: 2.5rem; font-weight: 700; color: #c8a84b; }
      p { font-size: 1.1rem; color: #aaa; max-width: 480px; line-height: 1.6; }
      .links { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
      a {
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        transition: opacity 0.2s;
      }
      a:hover { opacity: 0.85; }
      .primary { background: #c8a84b; color: #0f0f0f; }
      .secondary { background: #1e1e1e; color: #f0f0f0; border: 1px solid #333; }
    </style>
  </head>
  <body>
    <h1>⚔ MyClash</h1>
    <p>Free, open-source platform for HEMA event management — pools, brackets, live scoring, and results.</p>
    <div class="links">
      <a class="primary" href="https://app.myclash.fr">Open App</a>
      <a class="secondary" href="https://admin.myclash.fr">Organizer Admin</a>
      <a class="secondary" href="https://github.com/GrosTony6970/MyClash">GitHub</a>
    </div>
  </body>
</html>
