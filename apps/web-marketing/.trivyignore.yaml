# Findings the Trivy scan of the web-marketing image accepts. Read by the
# `trivy-images` job of .github/workflows/ci.yml, for this image only.
#
# Accepted by the operator on 2026-11-07. CVE-2026-78661 is in the
# golang.org/x/net module that the Caddy binary bundles (v0.60.0, fixed in
# 0.62.0, a denial of service through crafted HTML given to its parser).
# Caddy 2.11.9 is the newest release and still bundles v0.60.0; only Caddy's
# unreleased master has v0.62.0. This Caddy parses no HTML: the Caddyfile has
# no `templates` or `markdown`, it serves our own static files over plain HTTP
# on :80.
#
# The six entries accepted from 2026-10-10 to 2026-10-28 (the Go 1.26.8 runtime
# and go-jose v4.1.5 in Caddy 2.11.7) were removed on 2026-11-07: Caddy 2.11.9
# is built with Go 1.27.3 and go-jose v4.1.6, and a scan of `caddy:2-alpine`
# with no ignore file finds only CVE-2026-78661.
#
# REMOVE the entry when a Caddy release bundles golang.org/x/net 0.62.0 or
# later: `caddy:2-alpine` follows the newest release, so the scan is then green
# without it. The entry names the Caddy binary, so it accepts nothing in another
# file of the image.
vulnerabilities:
  - id: CVE-2026-78661
    paths:
      - usr/bin/caddy
    statement: golang.org/x/net/html v0.60.0 in the Caddy 2.11.9 binary. This Caddy parses no HTML (no templates or markdown in the Caddyfile). No Caddy release has the fix.
