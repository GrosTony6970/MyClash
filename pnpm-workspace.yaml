packages:
  - 'apps/*'
  - 'packages/*'

# pnpm-lock.yaml is TWO YAML documents. Because package.json pins pnpm 12, pnpm
# records its own version in a first "boot" document; the dependencies are in the
# second. pnpm audit, turbo and Dependabot's version updates read both. A tool that
# reads only the first sees no dependencies and reports no vulnerabilities, and
# GitHub's dependency graph is one of them (pnpm/pnpm#13805): turning Dependabot
# alerts on would raise no alerts. `pmOnFail: ignore` keeps one document, but
# pnpm then stops switching to the pinned version (operator ruling, 2026-10-31).

# Dependency install/postinstall scripts, allowlisted one by one. pnpm blocks
# every one of these by default (since pnpm 11; pnpm 10 only warned), so an
# unlisted package is denied, not silently run. A build script is arbitrary code
# executing at install time — decide each on what the script actually does, never
# by pasting whatever `pnpm approve-builds` offers. A `permissions:` block, if one
# is ever added, overrides this list (pnpm 12.11): keep build approval here.
allowBuilds:
  # Installs the platform-native binary. Vite, Vitest and tsx cannot run without it.
  esbuild: true
  # Native image pipeline behind next/image optimisation in the standalone runtime.
  sharp: true
  # Prebuilt native accelerator for msgpackr, which backs Next's build cache.
  msgpackr-extract: true
  # Library setup; arrives transitively via the Google GenAI tree.
  protobufjs: true
  # DENIED — `preinstall` is a literal no-op echo and `prepare` only runs for git
  # or local installs, never for a registry tarball. Nothing to gain.
  '@google/genai': false
  # DENIED — `opencollective || exit 0`, a donation banner.
  '@nestjs/core': false
  # DENIED — install-time analytics that reports home. Precisely what this
  # allowlist exists to stop.
  '@scarf/scarf': false
  # DENIED — the root `prepare: simple-git-hooks` script already installs the
  # hooks. Letting the dependency write them too is a second, unowned writer.
  simple-git-hooks: false

# Peer-range carve-outs, read by `pnpm peers check` (the `quality:peers` gate)
# as well as by install. Every entry below is upstream version lag, not
# breakage — no release of the package accepts our version yet.
#
# The shape, as pnpm 12 reads it (measured 2026-10-31):
#   - the key must be camelCase. `peer-dependency-rules:` is ignored with one
#     warning line, and the gate turns red on the peers it no longer silences.
#   - the selector is `parent>target`, the same grammar as `overrides` below.
#     Spaces around `>` are trimmed.
#   - keep the value quoted, as below. pnpm accepts a bare number, but YAML reads
#     a bare `12.10` as the number 12.1.
#
# Scoped to a major so the carve-out expires on its own: eslint 11, TypeScript 7
# or NestJS 13 will fall outside the range and redden the gate. It does NOT catch the other
# direction — a future jsx-a11y that narrows within eslint 10 stays silenced.
#
# Only `bad` issues are filtered, never `missing`; there are no missing peers
# today because the lockfile carries autoInstallPeers: true.
peerDependencyRules:
  allowedVersions:
    # No ESLint 10 release exists — 6.10.2 is latest and untouched since
    # 2024-10. Verified compatible rather than assumed: the plugin references
    # none of the removed ESLint 9 context APIs, and all 34 recommended rules
    # run clean in-process against eslint@10.8.0. Declared by packages/ui and
    # all three web apps.
    eslint-plugin-jsx-a11y>eslint: '10'
    # openapi-typescript@7.13.0 peers typescript ^5.x; ours is pinned ^6.0.3
    # deliberately (TS 7 has no programmatic compiler API until 7.1, which
    # `nest build` needs, and typescript-eslint peers <6.1.0). It drives the
    # compiler directly via `import ts from 'typescript'` and the OpenAPI drift
    # gate passes on 6.0.3.
    openapi-typescript>typescript: '6'
    # Both arrive with @astrojs/check, which web-marketing uses for `lint` and
    # `typecheck`. Each peers typescript ^5 against our pinned ^6.0.3, for the
    # same reason as openapi-typescript above: neither has published a range
    # naming 6 yet. Verified rather than assumed — `astro check` drives both
    # (tsconfck resolves the tsconfig, zod-to-ts renders the diagnostics) and
    # reports 0 errors and 0 warnings across all 17 files on 6.0.3.
    zod-to-ts>typescript: '6'
    tsconfck>typescript: '6'
    # nestjs-zod 5.5.0 (the latest, and its main branch) peers @nestjs/common
    # ^10 || ^11 and @nestjs/swagger ^7.4.2 || ^8 || ^11; no release names Nest 12
    # (issue #471). Verified rather than assumed: it reaches Nest only through root
    # exports and swagger's _OPENAPI_METADATA_FACTORY, every API test passes on
    # Nest 12.3.2, the edge tests' Zod refusals hold, and the generated client is
    # unchanged (quality:openapi-drift). Operator ruling, 2026-10-30. These are its
    # only two peers that move: zod and rxjs are in range.
    nestjs-zod>@nestjs/common: '12'
    nestjs-zod>@nestjs/swagger: '12'

# Transitive-version pins. Moved here verbatim from `package.json#pnpm.overrides`
# when the repo went to pnpm 11 — v11 no longer reads the `pnpm` field in
# package.json, and does so SILENTLY: leaving them there means every pin below
# quietly stops applying behind a green `pnpm install`. Several are security
# pins, so verify with `pnpm why <name>` + `pnpm security:audit` after any
# change, never by trusting a clean install.
#
# An override forces its version on EVERY transitive consumer, so prefer
# deleting a pin that is no longer needed over raising it to a new major.
#
# Audited 2026-08-07 with `pnpm why` on each: none is vestigial. What each one
# dedupes has drifted over time (glob now serves only @sentry/bundler-plugins — the
# source-map uploader, held on glob 10 against its own ^13 ask; @nestjs/cli 12 no
# longer uses it — minimatch serves eslint 10's config-array), so
# re-check the consumer before assuming a pin is dead — the reason it was added
# is rarely the reason it is still load-bearing.
overrides:
  # >=5.12.2 clears GHSA-667r-xxjv-c9mm, GHSA-p68q-wchp-6fh7, GHSA-hwr6-493r-vm6h and
  # GHSA-9q9j-q6p8-xq58 (request body replacement, an authentication bypass through
  # malformed URLs, request and header validation bypasses). >=5.12.5 clears
  # GHSA-4mh8-r7rc-xpvc. >=5.12.6 clears GHSA-389g-gv7q-r4x8 (a header validation
  # bypass through case-sensitive propertyNames). A tilde: the fix is a patch of 5.12.
  # Today the floor is also held by the API's own `^5.12.6` and by
  # @nestjs/platform-fastify 12.3.2, which asks for exactly 5.12.7 (11.2.6 asked for
  # 5.11.3, inside the advisory range, which is why the pin was written). Its remaining job
  # is the ceiling: one fastify, below 5.13, for both consumers.
  fastify: ~5.12.6
  # >=3.1.6 clears CVE-2026-75899/75931/75975/76172 (SSRF and host confusion).
  # The pin is the floor AND the ceiling in practice: ^3.1.5 resolved to exactly
  # 3.1.5, which is inside the advisory range, so the pin written to close the
  # PREVIOUS advisory (GHSA-4c8g-83qw-93j6, cleared by >=3.1.4) was holding the
  # tree on the vulnerable version. It reaches the API image through fastify →
  # @fastify/ajv-compiler, so a stale floor here ships.
  # >=3.1.9 clears GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h, GHSA-wjr9-j795-jxcr and
  # GHSA-333x-w4r6-6crp (scheme spoofing, path equivalence, host confusion, scheme
  # injection). A tilde: the fix is a patch of 3.1.
  fast-uri: ~3.1.9
  cross-spawn: ^7.0.6
  glob: ^10.5.0
  minimatch: ^9.0.9
  picomatch: ^4.0.5
  # >=0.35.0 cleared GHSA-f88m-g3jw-g9cj (four inherited libvips CVEs); >=0.35.4
  # clears GHSA-rgj7-g3m4-5g8c (two more, in libheif). next and astro 7 both ask
  # for ^0.35.4 themselves; web-marketing declares `^0.35.3` directly, the one
  # range left below the floor, so this pin holds that consumer on the fix.
  #
  # Raised to the advisory floor rather than left at ^0.35.0, which ALREADY
  # allowed the fix while the lockfile sat on 0.35.3: a range that permits the
  # patched version does not reach it on its own.
  #
  # >=0.35.5 clears GHSA-wq5f-xc86-pv6w (librsvg, inherited again).
  sharp: ^0.35.5
  # Transitive advisory floors. js-yaml is in the tree on two major lines at
  # once, so the key names the major — a bare `js-yaml` override would drag the
  # 5.x copy back to 4.x. That copy needs no pin now: its one consumer,
  # @nestjs/swagger 12.0.5, asks for exactly 5.5.0, past every 5.x advisory
  # (the newest, GHSA-r3ph-w7gj-g6xm, is <=5.4.0); a `~5.4.1` pin held it on 5.4.3.
  # >=4.3.2 clears GHSA-2883-xcg3-v3hh; ^4.3.1 resolved to exactly 4.3.1.
  'js-yaml@4': ^4.3.2
  # >=9.7.0 clears GHSA-c96f-x56v-gq3h (<=9.6.0). fastify (^9.6.0) and
  # @fastify/middie (^9.5.0) still admit a vulnerable version, so the pin stays. It is 9.10.0, not the advisory's
  # 9.7.0: an override replaces @nestjs/platform-fastify's own exact 9.10.0 ask, and
  # `^9.7.0` kept the lockfile on 9.7.0 under Nest's router.
  find-my-way: ^9.10.0
  # >=4.28.7 clears GHSA-c83g-rgw3-j3cx (unbounded query-cache growth) and
  # GHSA-73wf-gq98-2v4g (a prototype write from custom stats). Every consumer's
  # range (babel's ^4.24.0, webpack's ^4.28.1) already allowed the fix while
  # the lockfile sat on 4.28.2. It arrives through lint and build tooling.
  'browserslist@4': ^4.28.7
  # >=3.3.18 clears GHSA-2v37-7h3g-55p8 (a custom generator loops when size is
  # 0). Keyed to a major, as js-yaml and browserslist are: postcss asks for 3.x,
  # and a bare key would drag a future 5.x consumer back. It arrives through
  # postcss in next, vite and @tailwindcss/postcss: build and test tooling.
  'nanoid@3': ^3.3.18
  # >=8.2.4 clears GHSA-587h-7wmj-h5pm (launch-editor's existence check bypassed on
  # Windows). vitest's range already allowed the fix while the lockfile sat on 8.2.1.
  # Keyed to a major, as above. It arrives through vitest and astro (the marketing
  # build). A tilde, not a caret: the fix is a patch, and ^ took the minor released the
  # day before (8.3.5, with a new rolldown) into a production build.
  'vite@8': ~8.2.4
  # >=3.4.17 clears GHSA-cg2g-xh64-v4q7 and GHSA-mrv2-3pqr-j5jr (template expressions
  # surviving in shadow roots; an IN_PLACE hook that removes a parent). Only mermaid asks
  # for it (^3.4.12 since mermaid 12, which still allows the vulnerable 3.4.12-3.4.16):
  # the `docs:mermaid` check, dev tooling. A tilde, as vite's: the fix is a patch.
  'dompurify@3': ~3.4.17
  # >=8.10.2 clears GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3 and
  # GHSA-vp8m-p9jh-q5pm. Nobody declares undici directly: jsdom (^8.9.0, test
  # tooling) and astro's unifont (^8.0.0, the web-marketing build) both allowed
  # the fix while the lockfile sat on 8.10.0.
  # >=8.12.2 clears GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx
  # and GHSA-qrxm-fqhp-jwvm (a crash on stacked content-encodings, a cache shared
  # across a cross-origin redirect, TLS options dropped by an Agent, a TLS 1.2
  # renegotiation loop). A tilde: the fix is a patch of 8.12.
  'undici@8': ~8.12.2
  # >=4.6.6 clears GHSA-mrhx-c7xc-m3w5 (a large array that fails validation
  # collects one issue per item, with no cap, until the process runs out of
  # memory). The API validates every request body with zod (^4.4.3, which sat on
  # 4.4.3), so this one reaches a running service. The pin also holds the other
  # zod 4 consumers (astro, eslint-plugin-react-hooks, the AI SDKs). A tilde: the
  # fix is a patch.
  'zod@4': ~4.6.6
  # Every @google/design.md release, 0.4.0 included, declares zod ^3, and zod 3
  # has no fixed release. The tool BUNDLES its own zod 3.25.76 inside
  # dist/linter/index.js and never loads this dependency, so moving it to zod 4
  # changes nothing `designmd lint DESIGN.md` runs (operator ruling, 2026-10-28).
  # It only stops the audit listing a package nothing imports. The bundled copy
  # reads our own DESIGN.md. Delete this line when design.md declares zod 4.
  '@google/design.md>zod': ~4.6.6
  # >=2.1.6 clears GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p (unbounded
  # recursion). Arrives through minimatch 9 (^2.0.2) in eslint and glob: lint
  # and build tooling.
  'brace-expansion@2': ^2.1.6
  # >=1.2.2 clears GHSA-68fv-2mgg-jv7q (a source map with indexed sections
  # holds the event loop). Every consumer's range (postcss's ^1.2.1, css-tree's
  # ^1.2.1) already allowed the fix while the lockfile sat on 1.2.1. It arrives
  # through postcss in next, vite and @tailwindcss/postcss, and through css-tree
  # in jsdom: build and test tooling, reading our own source maps.
  'source-map-js@1': ^1.2.2
  # >=7.29.6 clears GHSA-4x5r-pxfx-6jf8 (a sourceMappingURL comment reads any
  # file). Only eslint-plugin-react-hooks asks for it (^7.24.4, which already
  # allowed the fix while the lockfile sat on 7.29.0): lint tooling. A tilde,
  # as vite's: the fix is a patch.
  '@babel/core@7': ~7.29.6

# Advisories the Dependency audit does not fail on (operator ruling,
# 2026-10-03). Each has NO fixed release to install and reaches no running
# service. `pnpm audit` still prints them as "(N ignored)", and a NEW advisory
# still fails the job. Trivy scans the images on the same rule
# (`ignore-unfixed: true` in ci.yml).
#
# An entry never expires on its own: the audit stays silent after the fix is
# published. Delete the entry the day `pnpm view <name> version` shows the
# patched version, then bump the lockfile.
auditConfig:
  ignoreGhsas:
    # http-cache-semantics <=4.2.0; the advisory names >=4.2.1, the registry's
    # latest is 4.2.0. Only astro asks for it, to cache REMOTE images during
    # `astro build`. web-marketing is `output: 'static'`, served by Caddy, and
    # loads no remote image.
    - GHSA-ch52-4w7c-c8xp
    # braces <=3.0.3; the advisory names >=3.0.4, the registry's latest is
    # 3.0.3. Only @next/eslint-plugin-next > fast-glob > micromatch asks for it:
    # lint tooling that expands our own patterns.
    - GHSA-vfj7-8cjw-p6xm

# Local fixes to a dependency's published code (operator ruling, 2026-10-28).
# Every Dockerfile that runs `pnpm install` copies patches/ before it: a frozen
# install checks each patch file's hash against the lockfile, even when that
# image never installs the patched package.
#
# nestjs-zod 5.5.0 (the latest) does not handle the `type: ["string", "null"]`
# shape that zod >= 4.5 writes for a nullable field, so the OpenAPI document
# described those fields as string arrays (issue #474, fix PR #477 unreleased).
# The patch rewrites the shape into the `anyOf` form zod 4.4 wrote, and the
# generated client is byte-identical to the one zod 4.4.3 produced.
# `quality:openapi-drift` holds it: without the patch the client drifts. Delete
# this entry and the file the day a nestjs-zod release carries the fix.
patchedDependencies:
  nestjs-zod@5.5.0: patches/nestjs-zod@5.5.0.patch
