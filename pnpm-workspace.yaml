packages:
  - 'apps/*'
  - 'packages/*'

# Dependency install/postinstall scripts, allowlisted one by one. pnpm 11 blocks
# every one of these by default (pnpm 10 only warned), so an unlisted package is
# denied, not silently run. A build script is arbitrary code executing at install
# time — decide each on what the script actually does, never by pasting whatever
# `pnpm approve-builds` offers.
allowBuilds:
  # Installs the platform-native binary. Vite, Vitest and tsx cannot run without it.
  esbuild: true
  # Native image pipeline behind next/image optimisation in the standalone runtime.
  sharp: true
  # Downloads the sentry-cli binary, used to upload source maps during `next build`
  # in each app's Docker builder stage.
  '@sentry/cli': true
  # Prebuilt native accelerator for msgpackr, which backs Next's build cache.
  msgpackr-extract: true
  # Library setup; arrives transitively via the Google GenAI / Sentry trees.
  protobufjs: true
  # DENIED — `preinstall` is a literal no-op echo and `prepare` only runs for git
  # or local installs, never for a registry tarball. Nothing to gain.
  '@google/genai': false
  # DENIED — `opencollective || exit 0`, a donation banner.
  '@nestjs/core': false
  # DENIED — install-time analytics that reports home. Precisely what this
  # allowlist exists to stop.
  '@scarf/scarf': false
  # DENIED — the root `prepare: simple-git-hooks` script already installs the
  # hooks. Letting the dependency write them too is a second, unowned writer.
  simple-git-hooks: false

# Supply-chain carve-out — TEMPORARY, delete once these age out.
#
# pnpm 11 refuses packages published within its minimum release age, which is a
# real defence against a compromised publish being pulled in before anyone
# notices. Both entries below were published on 2026-08-07, hours before this
# commit, and pnpm wrote this block itself to let the install through.
#
# They are here because BullMQ 6 removed `repeat` from JobsOptions in favour of
# job schedulers, and @nestjs/bullmq 11.0.5 is the FIRST release whose peer
# range accepts bullmq ^6 (11.0.4 tops out at ^5). There is no older version
# that works.
#
# Accepted deliberately: both are first-party @nestjs packages and the exclusion
# is pinned to exact versions rather than a range, so it cannot silently widen.
# Once these versions are past the age threshold, DELETE this whole block — it
# should not outlive the reason for it.
minimumReleaseAgeExclude:
  - '@nestjs/bull-shared@11.0.5'
  - '@nestjs/bullmq@11.0.5'

# Transitive-version pins. Moved here verbatim from `package.json#pnpm.overrides`
# when the repo went to pnpm 11 — v11 no longer reads the `pnpm` field in
# package.json, and does so SILENTLY: leaving them there means every pin below
# quietly stops applying behind a green `pnpm install`. Several are security
# pins, so verify with `pnpm why <name>` + `pnpm security:audit` after any
# change, never by trusting a clean install.
#
# An override forces its version on EVERY transitive consumer, so prefer
# deleting a pin that is no longer needed over raising it to a new major.
#
# Audited 2026-08-07 with `pnpm why` on each: none is vestigial. What each one
# dedupes has drifted over time (glob now serves @nestjs/cli and
# @sentry/bundler-plugin-core, minimatch serves eslint 10's config-array), so
# re-check the consumer before assuming a pin is dead — the reason it was added
# is rarely the reason it is still load-bearing.
overrides:
  fastify: ^5.11.2
  # >=3.1.4 clears GHSA-4c8g-83qw-93j6; the previous ^3.1.2 pin resolved to
  # exactly 3.1.2 and held the tree inside the advisory range.
  fast-uri: ^3.1.5
  cross-spawn: ^7.0.6
  glob: ^10.5.0
  minimatch: ^9.0.9
  picomatch: ^4.0.5
  import-in-the-middle: ^3.0.1
  # Transitive advisory floors. js-yaml is in the tree on two major lines at
  # once, so it needs a key per major — a bare `js-yaml` override would drag
  # the 5.x consumers back to 4.x.
  'js-yaml@4': ^4.3.1
  'js-yaml@5': ^5.2.3
  find-my-way: ^9.7.0
